<script>
(function() {
  var hashActual = '';
  try {
    hashActual = window.top.location.hash || '';
  } catch (e) {
    hashActual = window.location.hash || '';
  }
  if (hashActual.indexOf('#zona-referidor-galeria') !== 0) {
    return;
  }

  var REF, TS_LOGIN;
  try {
    var parametrosUrl = new URLSearchParams(window.top.location.search);
    REF = parametrosUrl.get('ref') || '';
    TS_LOGIN = parametrosUrl.get('t') || '';
  } catch (e) {
    var parametrosUrlLocal = new URLSearchParams(window.location.search);
    REF = parametrosUrlLocal.get('ref') || '';
    TS_LOGIN = parametrosUrlLocal.get('t') || '';
  }

  var SESION_MAXIMA_MS = 30 * 60 * 1000;
  var sesionExpirada = !TS_LOGIN || (Date.now() - parseInt(TS_LOGIN, 10)) > SESION_MAXIMA_MS;
  if (!REF || sesionExpirada) {
    window.top.location.href = 'https://maxx.mx/#zona-referidor';
    return;
  }

  var BASE_URL = 'https://script.google.com/macros/s/AKfycbxNl4ATBbC5fKm6SvIFwnApzEYt_qCkSSEcL-RXqoDucXSDcQjj_oOzWSL0oaGT5Qnn/exec';
  var CODIGOS_ADMIN = ['LGen_9997', 'LGen_9998', 'LGen_9999']; // mismos 3 códigos que en el backend — solo para mostrar/ocultar campos
  var ES_ADMIN = (CODIGOS_ADMIN.indexOf(REF) !== -1);
  var TAMANO_PROMEDIO_GRUPO = 15;

  var ENTIDADES_FEDERATIVAS = ['Aguascalientes', 'Baja California', 'Baja California Sur', 'Campeche', 'Chiapas',
    'Chihuahua', 'Ciudad de México', 'Coahuila', 'Colima', 'Durango', 'Guanajuato', 'Guerrero', 'Hidalgo',
    'Jalisco', 'México', 'Michoacán', 'Morelos', 'Nayarit', 'Nuevo León', 'Oaxaca', 'Puebla', 'Querétaro',
    'Quintana Roo', 'San Luis Potosí', 'Sinaloa', 'Sonora', 'Tabasco', 'Tamaulipas', 'Tlaxcala', 'Veracruz',
    'Yucatán', 'Zacatecas'];

  var SECTORES_ECONOMICOS = ['Agricultura, Ganadería y Pesca', 'Manufactura/Industrial', 'Construcción',
    'Comercio (Retail/Mayoreo)', 'Tecnología/TI', 'Servicios Financieros', 'Salud', 'Educación',
    'Alimentos y Bebidas', 'Transporte y Logística', 'Turismo y Hospitalidad', 'Energía', 'Telecomunicaciones',
    'Bienes Raíces', 'Gobierno/Sector Público', 'Servicios Profesionales', 'Medios y Entretenimiento',
    'Automotriz', 'Textil y Moda', 'Otro'];

  var RELIGIONES = ['Católica', 'Cristiana Evangélica', 'Judía', 'Musulmana', 'Budista', 'Testigos de Jehová', 'Mormona', 'Otra'];

  var MESES_ES = ['Enero', 'Febrero', 'Marzo', 'Abril', 'Mayo', 'Junio', 'Julio', 'Agosto', 'Septiembre', 'Octubre', 'Noviembre', 'Diciembre'];

  var COLOR_TIPO = {
    'Escuela': '#DCEAFB', 'Empresa': '#FCEAD6', 'Institución': '#FBE3E8', 'Personal': '#E3F2D9', 'Religioso': '#EDE3F5', 'Otro': '#EEEEEE'
  };
  var TIPOS_GRUPO_AFIN = ['Personal', 'Religioso', 'Grupo de Facebook', 'Grupo de Instagram', 'Grupo de WhatsApp', 'Grupo en Otra Red Social', 'Otro'];
  function esTipoGrupoAfin(tipo) { return TIPOS_GRUPO_AFIN.indexOf(tipo) !== -1; }
  // Distinto de TIPOS_GRUPO_AFIN (que rige sugerencias/horarios): esto
  // rige qué Tipos son "institucionales" — tienen una ubicación física
  // propia (Escuela/Empresa/Religioso/Otro) y por lo tanto tiene
  // sentido pedirles Planteles/Ubicaciones Y Entidad Federativa (dónde
  // vive ESA institución). Personal y los 4 tipos de Redes Sociales NO
  // son institucionales — son un grupo de personas sin domicilio
  // propio; ahí es cada PARTICIPANTE quien captura su propio Código
  // Postal y Entidad Federativa al registrarse, no la Entidad.
  var TIPOS_INSTITUCIONALES = ['Escuela', 'Empresa', 'Institución', 'Religioso', 'Otro'];
  function tipoEsInstitucional(tipo) { return TIPOS_INSTITUCIONALES.indexOf(tipo) !== -1; }
  var COLOR_ETAPA = {
    'Registrado': '#9AA0A6', 'Contactado': '#378ADD', 'Cita Agendada': '#EF9F27',
    'Programa Cerrado': '#639922', 'Pendiente': '#E0B400', 'No Interesado': '#C0392B'
  };

  function llenarSelectFederativa(el) {
    el.innerHTML = '<option value="">' + (el.id === 'zrg-f-federativa' ? 'Todas' : 'Selecciona...') + '</option>' +
      ENTIDADES_FEDERATIVAS.map(function(e) { return '<option value="' + e + '">' + e + '</option>'; }).join('');
  }

  // Convierte el texto de "Notas" (con entradas "[fecha hora] texto"
  // acumuladas) en HTML, resaltando cada marca de fecha/hora en azul
  // — para que se vea de un vistazo cuándo se hizo cada seguimiento.
  function formatearNotasConColor(texto) {
    if (!texto) return '<span style="color:#999;">Ningún seguimiento todavía.</span>';
    var escapado = String(texto).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    return escapado
      .replace(/\[(\d{2}\/\d{2}\/\d{4} \d{2}:\d{2})\]/g, '<span style="color:#185FA5; font-weight:bold;">[$1]</span>')
      .replace(/\n/g, '<br>');
  }

  function llenarSelectGenerico(el, lista, textoTodas) {
    el.innerHTML = '<option value="">' + textoTodas + '</option>' +
      lista.map(function(e) { return '<option value="' + e + '">' + e + '</option>'; }).join('');
  }
  llenarSelectGenerico(document.getElementById('zrg-alta-sector'), SECTORES_ECONOMICOS, 'Selecciona...');
  llenarSelectGenerico(document.getElementById('zrg-alta-religion'), RELIGIONES, 'Selecciona...');

  // Mostrar solo el campo que corresponde al Tipo elegido (Sector

  function actualizarCamposPorTipo(tipo, sufijoSector, sufijoPubPriv, sufijoReligion, sufijoPlanteles, idListaPlanteles) {
    var elSector = document.getElementById(sufijoSector);
    var elPubPriv = document.getElementById(sufijoPubPriv);
    var elReligion = document.getElementById(sufijoReligion);
    if (elSector) elSector.classList.toggle('zrg-oculto', tipo !== 'Empresa');
    if (elPubPriv) elPubPriv.classList.toggle('zrg-oculto', tipo !== 'Escuela');
    if (elReligion) elReligion.classList.toggle('zrg-oculto', tipo !== 'Religioso');
    // Planteles/Ubicaciones (con su Entidad Federativa y Código Postal
    // PROPIOS de cada plantel): solo aplican a Tipos institucionales
    // (Escuela/Empresa/Religioso/Otro). Personal y los 4 tipos de
    // Redes Sociales NO tienen domicilio propio como Entidad; ahí es
    // cada participante quien captura su propio Código Postal y
    // Entidad Federativa al registrarse.
    var esInstitucional = tipoEsInstitucional(tipo);
    if (sufijoPlanteles) {
      var elPlanteles = document.getElementById(sufijoPlanteles);
      if (elPlanteles) elPlanteles.classList.toggle('zrg-oculto', !esInstitucional);
      if (!esInstitucional && idListaPlanteles) zrgLimpiarPlanteles(idListaPlanteles);
    }

      .then(function(res) { return res.json(); })

  var idEntidadSeleccionada = null;

  // =====================================================================
  // ESCUELAS DEL LOTE — integradas a TUS Entidades (nov-2026 prueba: 22-oct)
  // Las escuelas asignadas por MAXX o seleccionadas por el referidor se
  // muestran como "Entidades" más (círculo con borde punteado) y usan los
  // mismos filtros. Al darlas de alta como Entidad pasan a ser una Entidad real.
  // =====================================================================
  var ESCUELAS_API = window.ZRG_ESCUELAS_API_PRUEBA || 'https://script.google.com/macros/s/AKfycbzjonaj5Qp3dQm7KQy0bvZnT_1HnqPFwj1Z_Puc8pPQ9oKpTX2w0WPjv8E4wF7Yf3V50g/exec';
  var RESUMEN_ESC = null;
  var TABLERO_ESC = null;
  var TABLERO_PIDIENDO = false;
  var accionEsc = {};

  function escH(t) { return String(t == null ? '' : t).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
  function postEsc(obj) {
    obj.ref = REF;
    return fetch(ESCUELAS_API, { method: 'POST', mode: 'cors', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(obj) })
      .then(function(res) { return res.json(); });
  }
  function getEsc(params) {
    var qs = Object.keys(params).map(function(k) { return k + '=' + encodeURIComponent(params[k]); }).join('&');
    return fetch(ESCUELAS_API + '?' + qs).then(function(res) { return res.json(); });
  }
  function opcionesEsc(lista, vacio) {
    return (vacio ? '<option value="">' + escH(vacio) + '</option>' : '') + lista.map(function(x) { return '<option>' + escH(x) + '</option>'; }).join('');
  }

  // Misma ruta de etapas que ya usa TUS Entidades, para que colores y filtros funcionen igual.
  function etapaDeEscuela(e) {
    if (e.resultado === 'Cita agendada') return 'Cita Agendada';
    if (e.resultado === 'Programa cerrado') return 'Programa Cerrado';
    if (e.resultado === 'No interesada') return 'No Interesado';
    if (e.resultado === 'No responde') return 'Pendiente';
    if (e.resultado === 'Contactada' || e.contactoNombre) return 'Contactado';
    return 'Registrado';
  }
  function federativaDeEscuela(txt) {
    var t = String(txt || '');
    for (var i = 0; i < ENTIDADES_FEDERATIVAS.length; i++) { if (t.indexOf(ENTIDADES_FEDERATIVAS[i]) === 0) return ENTIDADES_FEDERATIVAS[i]; }
    return t;
  }
  function escuelaComoEntidad(e) {
    var razon = (e.resultado === 'No responde') ? 'Sin respuesta tras 2 intentos' : '';
    return {
      esEscuela: true, sch: e, idEntidad: e.idAsignacion, nombre: e.nombre, tipo: 'Escuela',
      planteles: [{ nombre: e.municipio, direccion: '', entidadFederativa: federativaDeEscuela(e.entidad), codigoPostal: '' }],
      grupos: [{ etapaFunnel: etapaDeEscuela(e), razonEstado: razon }],
      contactos: e.contactoNombre ? [{ nombre: e.contactoNombre, puesto: e.contactoPuesto, telefono: '', correo: '' }] : [],
      notas: e.notas, fechaAlta: null, proximoSeguimiento: null
    };
  }
  function pasaFiltroLote(ent, v) {
    if (!v) return true;
    if (v === 'propias') return !ent.esEscuela;
    if (!ent.esEscuela) return false;
    if (v === 'lote') return true;
    if (v === 'Seleccionadas') return !!ent.sch.seleccionada;
    return ent.sch.categoria === v;
  }

  function abrirFormEsc(id, acc) {
    accionEsc[id] = acc;
    var f = document.getElementById('zrg-esc-f-' + id); if (!f) return;
    f.classList.remove('zrg-oculto');
    document.getElementById('zrg-esc-canal-w-' + id).classList.toggle('zrg-oculto', !(acc === 'intento' || acc === 'contactada'));
    document.getElementById('zrg-esc-con-w-' + id).classList.toggle('zrg-oculto', !(acc === 'contactada' || acc === 'cita'));
    document.getElementById('zrg-esc-nota-l-' + id).textContent = (acc === 'no_interesada') ? 'Qué te dijeron (obligatorio)' : 'Nota (opcional)';
    document.getElementById('zrg-esc-msg-' + id).textContent = '';
  }

  function guardarGestionEsc(id) {
    var acc = accionEsc[id]; if (!acc) return;
    var m = document.getElementById('zrg-esc-msg-' + id);
    var btn = elDetalle.querySelector('[data-esc-guardar="' + id + '"]');
    btn.disabled = true; btn.textContent = 'Guardando...';
    postEsc({ accion: 'registrarGestion', idAsignacion: id, tipo: acc,
      canal: document.getElementById('zrg-esc-canal-' + id).value,
      contactoNombre: document.getElementById('zrg-esc-nom-' + id).value.trim(),
      contactoPuesto: document.getElementById('zrg-esc-pue-' + id).value.trim(),
      nota: document.getElementById('zrg-esc-nota-' + id).value.trim()
    }).then(function(r) {
      if (r.exito) {
        if (acc === 'contactada' || acc === 'cita') {
          var entEsc = (todasMisEntidades || []).filter(function(x) { return x.idEntidad === id; })[0];
          if (entEsc && !entEsc.sch.idEntidad) {
            m.className = 'zrg-esc-msg'; m.textContent = 'Guardado. Convirtiendo en Entidad...';
            convertirEscuelaEnEntidad(entEsc.sch, document.getElementById('zrg-esc-nom-' + id).value.trim(), document.getElementById('zrg-esc-pue-' + id).value.trim());
            return;
          }
        }
        idEntidadSeleccionada = id; todasMisEntidades = null; cargarYFiltrar();
      }
      else { btn.disabled = false; btn.textContent = 'Guardar'; m.className = 'zrg-esc-msg zrg-estado-error'; m.textContent = r.error || 'No se pudo guardar.'; }
    }).catch(function() { btn.disabled = false; btn.textContent = 'Guardar'; m.className = 'zrg-esc-msg zrg-estado-error'; m.textContent = 'No se pudo conectar. Intenta de nuevo.'; });
  }

  // Conversión automática: la escuela del lote pasa a ser Entidad con sus datos del directorio (nada se reescribe).
  function convertirEscuelaEnEntidad(sch, contactoNombre, contactoPuesto) {
    var h = { 'Content-Type': 'text/plain;charset=utf-8' };
    function llamar(obj) { return fetch(BASE_URL, { method: 'POST', mode: 'cors', headers: h, body: JSON.stringify(obj) }).then(function(res) { return res.json(); }); }
    function terminar() { todasMisEntidades = null; cargarYFiltrar(); }
    llamar({
      accion: 'darDeAltaEntidad', ref: REF, nombre: sch.nombre, tipo: 'Escuela',
      planteles: [{ nombre: sch.municipio || '', direccion: '', entidadFederativa: federativaDeEscuela(sch.entidad), codigoPostal: '' }],
      empleadosElegibles: '', sectorEconomico: '', publicoPrivado: '', religion: '',
      telefono: sch.telefono || '', correo: sch.correo || '', web: sch.web || '',
      notas: 'Viene de mi lote de Escuelas.'
    }).then(function(d) {
      if (!d.exito) { terminar(); return; }
      var idNueva = d.idEntidad;
      var pContacto = contactoNombre
        ? llamar({ accion: 'darDeAltaContacto', ref: REF, idEntidad: idNueva, nombre: contactoNombre, puesto: contactoPuesto, telefono: '', correo: '', decisor: 'No sé', notas: '' }).catch(function() {})
        : Promise.resolve();
      return pContacto.then(function() {
        return postEsc({ accion: 'registrarGestion', idAsignacion: sch.idAsignacion, tipo: 'seguimiento', idEntidad: idNueva, nota: 'Convertida en Entidad ' + idNueva });
      }).then(function() { idEntidadSeleccionada = idNueva; terminar(); }, function() { idEntidadSeleccionada = idNueva; terminar(); });
    }).catch(terminar);
  }

  // (Respaldo) abre el formulario de alta ya existente, con los datos de la escuela.
  var altaDesdeEscuela = null;
  function altaDesdeEsc(id) {
    var ent = (todasMisEntidades || []).filter(function(x) { return x.idEntidad === id; })[0];
    if (!ent) return;
    altaDesdeEscuela = ent.sch;
    var e = ent.sch;
    document.getElementById('zrg-alta-nombre').value = e.nombre;
    document.getElementById('zrg-alta-tipo').value = 'Escuela';
    actualizarCamposPorTipo('Escuela', 'zrg-alta-sector-wrap', 'zrg-alta-pubpriv-wrap', 'zrg-alta-religion-wrap', 'zrg-alta-planteles-wrap', 'zrg-alta-planteles-lista');
    document.getElementById('zrg-alta-pubpriv').value = 'Privada';
    zrgLimpiarPlanteles('zrg-alta-planteles-lista');
    window.zrgAgregarFilaPlantel('zrg-alta-planteles-lista', { nombre: e.municipio || '', direccion: '', entidadFederativa: federativaDeEscuela(e.entidad), codigoPostal: '' });
    document.getElementById('zrg-alta-notas').value = 'Viene de mi lote de Escuelas.' + (e.telefono ? ' Tel: ' + e.telefono + '.' : '');
    elFormAlta.classList.remove('zrg-oculto');
    elBtnMostrarAlta.classList.add('zrg-oculto');
    elEstadoAlta.textContent = 'Revisa los datos y pulsa «Guardar Entidad». Al guardar, esta escuela pasa a ser una Entidad.';
    elFormAlta.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }
  // Se llama tras guardar con éxito una Entidad creada desde una escuela del lote.
  function ligarEscuelaConEntidad(idEntidadNueva) {
    if (!altaDesdeEscuela) return;
    var asg = altaDesdeEscuela.idAsignacion; altaDesdeEscuela = null;
    postEsc({ accion: 'registrarGestion', idAsignacion: asg, tipo: 'seguimiento', idEntidad: idEntidadNueva, nota: 'Dada de alta como Entidad ' + idEntidadNueva })
      .then(function() { todasMisEntidades = null; cargarYFiltrar(); })
      .catch(function() { todasMisEntidades = null; cargarYFiltrar(); });
  }

  // ---------- Selección desde el buscador ----------

      .then(function(res) { return res.json(); }).catch(function() { return { exito: false }; });
    var pDir = (texto.length >= 3)
      ? getEsc({ accion: 'buscarEscuelas', ref: REF, q: texto }).catch(function() { return { exito: false }; })
      : Promise.resolve({ exito: false });
    Promise.all([pEnt, pDir]).then(function(r) {
      var data = r[0], dir = r[1], html = '';
      if (data.exito && data.coincidencias.length > 0) {
        data.coincidencias.forEach(function(c) {
          var quienLaTiene = (c.codigoReferidor === REF) ? 'TU código' : 'el código ' + c.codigoReferidor;

  // --- Helpers de "Planteles / Ubicaciones" (lista dinámica, se
  // usan tanto en "Dar de alta" como en "Editar"). Cada Plantel es
  // su propia tarjeta con Nombre, Dirección, Entidad Federativa y
  // Código Postal — a propósito NO hay un solo valor de Entidad
  // Federativa para toda la Entidad, porque cada plantel puede estar
  // en un estado distinto.
  window.zrgAgregarFilaPlantel = function(contenedorId, datosPlantel) {
    datosPlantel = datosPlantel || {};
    var contenedor = document.getElementById(contenedorId);
    if (!contenedor) return;
    var fila = document.createElement('div');
    fila.className = 'zrg-plantel-fila';

    var filaSup = document.createElement('div');
    filaSup.className = 'zrg-plantel-fila-sup';
    var elNombre = document.createElement('input');
    elNombre.type = 'text';
    elNombre.placeholder = 'Nombre del plantel (ej. "Campus Norte")';
    elNombre.className = 'zrg-plantel-nombre';
    elNombre.value = datosPlantel.nombre || '';
    var elQuitar = document.createElement('button');
    elQuitar.type = 'button';
    elQuitar.className = 'zrg-btn-quitar-plantel';
    elQuitar.textContent = 'Quitar';
    elQuitar.addEventListener('click', function() {
      fila.remove();
      contenedor.dispatchEvent(new Event('input'));
    });
    filaSup.appendChild(elNombre);
    filaSup.appendChild(elQuitar);

    var elDireccion = document.createElement('input');
    elDireccion.type = 'text';
    elDireccion.placeholder = 'Dirección (calle, número, colonia)';
    elDireccion.className = 'zrg-plantel-direccion';
    elDireccion.value = datosPlantel.direccion || '';

    var filaInf = document.createElement('div');
    filaInf.className = 'zrg-plantel-fila-inf';
    var elFederativa = document.createElement('select');
    elFederativa.className = 'zrg-plantel-federativa';
    llenarSelectFederativa(elFederativa);
    elFederativa.value = datosPlantel.entidadFederativa || '';
    var elCP = document.createElement('input');
    elCP.type = 'text';
    elCP.placeholder = 'C.P.';
    elCP.className = 'zrg-plantel-cp';
    elCP.value = datosPlantel.codigoPostal || '';
    filaInf.appendChild(elFederativa);
    filaInf.appendChild(elCP);

    fila.appendChild(filaSup);
    fila.appendChild(elDireccion);
    fila.appendChild(filaInf);
    contenedor.appendChild(fila);
  };

  function zrgLeerPlanteles(contenedorId) {
    var contenedor = document.getElementById(contenedorId);
    if (!contenedor) return [];
    var planteles = [];
    contenedor.querySelectorAll('.zrg-plantel-fila').forEach(function(fila) {
      var nombre = fila.querySelector('.zrg-plantel-nombre').value.trim();
      var direccion = fila.querySelector('.zrg-plantel-direccion').value.trim();
      var entidadFederativa = fila.querySelector('.zrg-plantel-federativa').value;
      var codigoPostal = fila.querySelector('.zrg-plantel-cp').value.trim();
      if (nombre || direccion || entidadFederativa || codigoPostal) {
        planteles.push({ nombre: nombre, direccion: direccion, entidadFederativa: entidadFederativa, codigoPostal: codigoPostal });
      }
    });
    return planteles;
  }

  var CARGA_ID = 0;
  var PRIMERA_CARGA = true;
  var CLAVE_CACHE = 'zrg_cache_v1_' + REF;
  function conTope(promesa, ms, msg) {
    return Promise.race([promesa, new Promise(function(_, rej) { setTimeout(function() { rej(new Error(msg)); }, ms); })]);
  }
  function pedirEntidades(reintentos) {
    var qsRef = '?accion=misEntidades&ref=' + encodeURIComponent(REF);
    return conTope(fetch(ESCUELAS_API + qsRef).then(function(res) { return res.json(); }), 30000, 'tiempo agotado (30 s)')
      .then(function(d) { if (!d || !d.exito) { throw new Error('respuesta no válida'); } return d; })
      .catch(function(e0) {
        return conTope(fetch(BASE_URL + qsRef).then(function(res) { return res.json(); }), 45000, 'tiempo agotado (45 s)')
          .catch(function(e) { if (reintentos > 0) { return pedirEntidades(reintentos - 1); } throw e; });
      });
  }

  function cargarYFiltrar() {
    if (todasMisEntidades !== null) { aplicarFiltros(); return; }
    var cargaId = ++CARGA_ID, t0 = Date.now();
    var entData = null, escData = null, escListo = false, errEsc = '', tEnt = null, tEsc = null, hayCache = false, frescoEnt = false, frescoEsc = false, falloActualizar = false;
    elCargando.style.display = 'block';
    elCargando.textContent = 'Cargando TUS Entidades... 0 s';
    var tick = setInterval(function() {
      if (cargaId !== CARGA_ID || elCargando.style.display === 'none') { clearInterval(tick); return; }
      elCargando.textContent = 'Cargando TUS Entidades... ' + Math.round((Date.now() - t0) / 1000) + ' s';
    }, 1000);

    function guardarCache() {
      try { if (entData && escListo && escData && escData.exito) { localStorage.setItem(CLAVE_CACHE, JSON.stringify({ t: Date.now(), ent: entData, esc: escData })); } } catch (eg) {}
    }
    function combinar() {
      if (cargaId !== CARGA_ID || !entData) return;
      elCargando.style.display = 'none';
      RESUMEN_ESC = (escData && escData.exito) ? escData : null;
      var escuelas = RESUMEN_ESC ? RESUMEN_ESC.escuelas.filter(function(e) { return !e.idEntidad; }).map(escuelaComoEntidad) : [];
      todasMisEntidades = entData.entidades.concat(escuelas);
      var elTitulo = document.getElementById('zrg-titulo-entidades');
      var n = entData.entidades.length, m = escuelas.length;
      var txtN = n === 0 ? 'Todavía no tienes Entidades dadas de alta' : (n === 1 ? 'Tienes 1 Entidad dada de alta' : 'Tienes ' + n + ' Entidades dadas de alta');
      elTitulo.textContent = (m > 0)
        ? txtN + ' y ' + m + (m === 1 ? ' Escuela en TU Lote' : ' Escuelas en TU Lote') + ', ¿deseas filtrarlas?'
        : (n === 0 ? txtN : txtN + ', ¿deseas filtrar' + (n === 1 ? 'la?' : 'las?'));
      if (RESUMEN_ESC && RESUMEN_ESC.esAdmin) {
        elTitulo.insertAdjacentHTML('beforeend', ' <small style="color:#888;font-weight:normal;font-size:11px;">(carga: Entidades ' + (tEnt === null ? '…' : tEnt + ' s') + ' · Escuelas ' + (tEsc === null ? '…' : tEsc + ' s') + ')</small>');
      }
      pintarResumenLote();
      var pnl = document.getElementById('zrg-lote-resumen');
      if (!RESUMEN_ESC && pnl) {
        pnl.innerHTML = escListo
          ? '<p style="color:#791F1F;font-size:13px;">Escuelas del lote no disponibles: ' + escH(errEsc || (escData && escData.error) || 'sin respuesta') + '</p>'
          : '<p style="color:#666;font-size:13px;">Cargando Escuelas de TU lote...</p>';
      }
      aplicarFiltros();
      pintarEstadoViejo();
      asegurarTablero();
    }
    function pintarEstadoViejo() {
      var viejo = hayCache && !(frescoEnt && frescoEsc);
      var bn = document.getElementById('zrg-banner-viejo');
      if (bn) {
        if (viejo && falloActualizar) { bn.innerHTML = 'No se pudo actualizar. <button type="button" class="zrg-btn zrg-btn-chico" id="zrg-reintentar-act">Reintentar</button>'; bn.style.display = 'block'; var rb2 = document.getElementById('zrg-reintentar-act'); if (rb2) rb2.addEventListener('click', function() { todasMisEntidades = null; cargarYFiltrar(); }); }
        else if (viejo) { bn.innerHTML = 'Mostrando lo último guardado. <b>Actualizando…</b> Podrás abrir y gestionar en cuanto termine.'; bn.style.display = 'block'; }
        else { bn.style.display = 'none'; }
      }
      elFranja.classList.toggle('zrg-viejo', viejo);
      elDetalle.classList.toggle('zrg-viejo', viejo);
    }

    // Primera carga de la visita: se muestra al instante lo ultimo guardado en este navegador y se actualiza en segundo plano.
    if (PRIMERA_CARGA) {
      PRIMERA_CARGA = false;
      try {
        var gu = JSON.parse(localStorage.getItem(CLAVE_CACHE) || 'null');
        if (gu && gu.ent && gu.ent.exito && (Date.now() - gu.t) < 7 * 24 * 3600 * 1000) {
          entData = gu.ent; escData = gu.esc || null; escListo = true; tEnt = 0; tEsc = 0;
          hayCache = true; combinar();
        }
      } catch (ec) {}
    }
    hayCache = !!entData;
    // Las Entidades se pintan en cuanto llegan; las Escuelas se suman cuando lleguen.
    pedirEntidades(1).then(function(d) {
      clearInterval(tick);
      if (!d.exito) { elCargando.style.display = 'none'; elFranja.innerHTML = '<p style="color:#791F1F;">No se pudieron cargar TUS Entidades.</p>'; return; }
      tEnt = Math.round((Date.now() - t0) / 1000); entData = d; frescoEnt = true; combinar(); guardarCache();
    }).catch(function(e) {
      clearInterval(tick);
      if (cargaId !== CARGA_ID) return;
      if (hayCache) { falloActualizar = true; pintarEstadoViejo(); return; }
      elCargando.innerHTML = 'No se pudo conectar (' + escH(String((e && e.message) || e)) + '). <button type="button" class="zrg-btn zrg-btn-chico" id="zrg-reintentar-carga">Reintentar</button>';
      var rb = document.getElementById('zrg-reintentar-carga');
      if (rb) rb.addEventListener('click', function() { todasMisEntidades = null; cargarYFiltrar(); });
    });
    conTope(getEsc({ accion: 'misEscuelas', ref: REF }), 30000, 'tiempo agotado (30 s)')
      .catch(function(e) { errEsc = String((e && e.message) || e); return null; })
      .then(function(r) { tEsc = Math.round((Date.now() - t0) / 1000); escData = r; escListo = true; frescoEsc = true; if (entData) { combinar(); guardarCache(); } });
  }

  function pares(l) { return l.map(function(x) { return [x, x]; }); }

  var TIPOS_AFINES = [['Personal','Grupo Personal'],['Religioso','Grupo Religioso'],['Grupo de Facebook','Grupo de Facebook'],['Grupo de Instagram','Grupo de Instagram'],['Grupo de WhatsApp','Grupo de WhatsApp'],['Grupo en Otra Red Social','Grupo en Otra Red Social']];
  var ESTADOS_ESC = [['altas','Ya dadas de alta como Entidad']].concat(ESTADOS_LOTE);
  function cadenaCascada() {
    var etapa = { k: 'etapa', etiqueta: 'Etapa Actual de Pipeline', todos: 'Todas', ops: pares(ETAPAS_CASC) };
    var fed = { k: 'fed', etiqueta: 'Entidad Federativa', todos: 'Todas', ops: pares(ENTIDADES_FEDERATIVAS) };
    switch (CASC.ver) {
      case 'Escuela': return [{ k: 'estado', etiqueta: 'Mis Escuelas', todos: 'Todas mis Escuelas', ops: ESTADOS_ESC }, etapa, fed];
      case 'Empresa': return [etapa, { k: 'sector', etiqueta: 'Sector Económico', todos: 'Todos', ops: pares(SECTORES_ECONOMICOS) }, fed];
      case 'Afines': return [{ k: 'tipo', etiqueta: 'Tipo de Grupo', todos: 'Todos los Grupos Afines', ops: TIPOS_AFINES }, etapa, fed];
      default: return [etapa, fed];
    }
  }
  function textoVer() {
    return { '': 'Todas', 'Escuela': 'Escuelas', 'Empresa': 'Empresas', 'Institución': 'Instituciones', 'Afines': 'Grupos Afines', 'Otro': 'Otras' }[CASC.ver];
  }
  function etiquetaOpcion(nivel, v) {
    if (v === '*') return nivel.todos;
    for (var i = 0; i < nivel.ops.length; i++) { if (nivel.ops[i][0] === v) { return nivel.ops[i][1].split(':')[0]; } }
    return v;
  }

  function pintarCascada() {
    pintarResumenLote();
    var tb = document.getElementById('zrg-tablero-esc'); if (tb) { tb.style.display = (CASC.ver === 'Escuela') ? '' : 'none'; }
    asegurarTablero();
    Array.prototype.forEach.call(document.querySelectorAll('#zrg-casc-ver button'), function(b) {
      b.classList.toggle('zrg-ver-activo', b.dataset.ver === CASC.ver);
    });
    var cad = cadenaCascada(), h = '';
    for (var i = 0; i < cad.length; i++) {
      if (i > 0 && !CASC.niv[i - 1]) break;
      var n = cad[i], val = CASC.niv[i] || '';
      h += '<div class="zrg-casc-nivel"><label>' + escH(n.etiqueta) + '</label><select data-nivel="' + i + '">' +
        '<option value=""' + (val === '' ? ' selected' : '') + '>Selecciona...</option>' +
        '<option value="*"' + (val === '*' ? ' selected' : '') + '>' + escH(n.todos) + '</option>' +
        n.ops.map(function(o) { return '<option value="' + escH(o[0]) + '"' + (val === o[0] ? ' selected' : '') + '>' + escH(o[1]) + '</option>'; }).join('') +
        '</select></div>';
    }
    document.getElementById('zrg-casc-niveles').innerHTML = h;
    // Resumen de lo activo, con ✕ para quitar desde ese nivel hacia abajo
    var r = '', hay = false;
    if (CASC.ver) { hay = true; r += '<span class="zrg-resumen-chip">' + escH(textoVer()) + '<button type="button" data-quitar="ver">✕</button></span>'; }
    for (var j = 0; j < cad.length; j++) {
      if (!CASC.niv[j]) break;
      hay = true;
      r += '<span class="zrg-resumen-chip">' + escH(etiquetaOpcion(cad[j], CASC.niv[j])) + '<button type="button" data-quitar="' + j + '">✕</button></span>';
    }
    var cajaR = document.getElementById('zrg-casc-resumen');
    if (hay) { r += ' <button type="button" class="zrg-resumen-limpiar" data-quitar="todo">Limpiar todo</button>'; }
    cajaR.innerHTML = r;
    cajaR.classList.toggle('zrg-oculto', !hay);
  }

  function filtrosActuales() {
    var f = { loteSel: '', tipos: [], etapa: '', federativa: '', sector: '' };
    if (CASC.ver === 'Afines') { f.tipos = TIPOS_AFINES.map(function(t) { return t[0]; }); }
    else if (CASC.ver) { f.tipos = [CASC.ver]; }
    cadenaCascada().forEach(function(n, i) {
      var v = CASC.niv[i]; if (!v || v === '*') return;
      if (n.k === 'estado') { f.loteSel = (v === 'altas') ? 'propias' : v; }
      else if (n.k === 'tipo') { f.tipos = [v]; }
      else if (n.k === 'etapa') { f.etapa = v; }
      else if (n.k === 'fed') { f.federativa = v; }
      else if (n.k === 'sector') { f.sector = v; }
    });
    return f;
  }

  document.getElementById('zrg-casc-ver').addEventListener('click', function(ev) {
    var b = ev.target.closest('button'); if (!b) return;
    CASC.ver = b.dataset.ver; CASC.niv = [];
    pintarCascada(); aplicarFiltros();
  });
  document.getElementById('zrg-casc-niveles').addEventListener('change', function(ev) {
    var sel = ev.target; if (!sel.dataset || sel.dataset.nivel === undefined) return;
    var i = parseInt(sel.dataset.nivel, 10);
    CASC.niv = CASC.niv.slice(0, i);
    CASC.niv[i] = sel.value;
    if (!sel.value) { CASC.niv.length = i; }
    pintarCascada(); aplicarFiltros();
  });
  document.getElementById('zrg-casc-resumen').addEventListener('click', function(ev) {
    var b = ev.target.closest('button'); if (!b) return;
    var q = b.dataset.quitar;
    if (q === 'todo' || q === 'ver') { CASC.ver = ''; CASC.niv = []; }
    else { CASC.niv = CASC.niv.slice(0, parseInt(q, 10)); }
    pintarCascada(); aplicarFiltros();
  });

  function aplicarFiltros() {
    var f = filtrosActuales();
    var texto = document.getElementById('zrg-f-texto').value.trim().toLowerCase();
    var solo30dias = document.getElementById('zrg-f-30dias').checked;
    var soloSeguimientoHoy = document.getElementById('zrg-f-seguimiento-hoy').checked;
    var hace30dias = Date.now() - (30 * 24 * 60 * 60 * 1000);
    var finDeHoy = new Date(); finDeHoy.setHours(23,59,59,999);

    var filtradas = (todasMisEntidades || []).filter(function(ent) {
      if (!pasaFiltroLote(ent, f.loteSel)) return false;
      if (f.tipos.length && f.tipos.indexOf(ent.tipo) === -1) return false;
      if (f.etapa && etapaDe(ent) !== f.etapa) return false;
      if (f.federativa) {
        // La Entidad Federativa vive en cada Plantel: basta que CUALQUIERA esté en el estado elegido.
        var coincideFederativa = (ent.planteles || []).some(function(p) { return p.entidadFederativa === f.federativa; });
        if (!coincideFederativa) return false;
      }
      if (f.sector && ent.sectorEconomico !== f.sector) return false;
      if (solo30dias && (!ent.fechaAlta || ent.fechaAlta < hace30dias)) return false;
      if (soloSeguimientoHoy && (!ent.proximoSeguimiento || ent.proximoSeguimiento > finDeHoy.getTime())) return false;
      if (texto) {
        var enNombre = (ent.nombre || '').toLowerCase().indexOf(texto) !== -1;
        var enContacto = (ent.contactos || []).some(function(c) { return (c.nombre || '').toLowerCase().indexOf(texto) !== -1; });
        if (!enNombre && !enContacto) return false;
      }
      return true;
    });

    pintarFranja(filtradas);
  }

  document.getElementById('zrg-f-30dias').addEventListener('change', aplicarFiltros);
  document.getElementById('zrg-f-seguimiento-hoy').addEventListener('change', aplicarFiltros);
  var temporizadorFiltroTexto = null;
  document.getElementById('zrg-f-texto').addEventListener('input', function() {
    clearTimeout(temporizadorFiltroTexto);
    temporizadorFiltroTexto = setTimeout(aplicarFiltros, 250);
  });
  pintarCascada();

  // Leyenda bajo cada círculo: lo que está sin trabajar se ve en rojo.
  function leyendaChip(ent) {
    if (ent.esEscuela) {
      var c = ent.sch.categoria;
      if (c === 'Nuevas') return { texto: 'Por gestionar', alerta: true };
      if (c === 'Por contactar') return { texto: 'Falta contactar', alerta: false };
      if (c === 'En seguimiento') return { texto: 'En seguimiento', alerta: false };
      if (c === 'Cerradas') return { texto: 'Cerrada', alerta: false };
      return { texto: ent.sch.seleccionada ? 'Seleccionada' : '', alerta: false };
    }
    var et = etapaDe(ent);
    var terminal = (et === 'Programa Cerrado' || et === 'No Interesado');
    if (ent.proximoSeguimiento && ent.proximoSeguimiento <= Date.now() && !terminal) {
      return { texto: 'Seguimiento atrasado', alerta: true };
    }
    if (et === 'Registrado') return { texto: 'Por gestionar', alerta: true };
    return { texto: et === 'Cita Agendada' ? 'Cita agendada' : (et === 'No Interesado' ? 'No interesado' : et), alerta: false };
  }

  function pintarFranja(entidades) {
    elConteoFiltro.classList.remove('zrg-oculto');
    elConteoFiltro.textContent = entidades.length === 0
      ? 'Ninguna Entidad coincide con esos filtros.'
      : (entidades.length === 1 ? '1 Entidad' : entidades.length + ' Entidades');

    if (entidades.length === 0) {
      elFranja.innerHTML = '';
      elDetalle.innerHTML = '';
      idEntidadSeleccionada = null;
      return;
    }

    var html = '';
    entidades.forEach(function(ent) {
      var activo = (ent.idEntidad === idEntidadSeleccionada) ? ' zrg-chip-activo' : '';
      var colorEtapa = COLOR_ETAPA[etapaDe(ent)] || '#9AA0A6';
      var colorTipo = COLOR_TIPO[ent.tipo] || COLOR_TIPO['Otro'];
      var leyenda = leyendaChip(ent);
      html += '<button class="zrg-chip-entidad' + activo + (ent.esEscuela ? ' zrg-chip-esc' : '') + (leyenda.alerta ? ' zrg-chip-pend' : '') + '" onclick="window.zrgSeleccionarEntidad(\'' + ent.idEntidad + '\')">' +
        '<div class="zrg-chip-circulo" style="background:' + colorTipo + ';">' +
        '<span class="zrg-chip-circulo-texto">' + ent.nombre + '</span>' +
        '<span class="zrg-chip-punto" style="background:' + colorEtapa + ';"></span></div>' +
        (leyenda.texto ? '<span class="zrg-chip-sub">' + escH(leyenda.texto) + '</span>' : '') + '</button>';
    });
    elFranja.classList.toggle('zrg-franja-centrada', entidades.length < 7);
    elFranja.innerHTML = html;

    if (idEntidadSeleccionada) {
      var entSeleccionada = entidades.filter(function(e) { return e.idEntidad === idEntidadSeleccionada; })[0];
      if (entSeleccionada) {
        pintarDetalle(entSeleccionada); // sigue abierta — se repinta con los datos frescos
      } else {
        idEntidadSeleccionada = null;
        elDetalle.innerHTML = '';
      }
    }
  }

  window.zrgSeleccionarEntidad = function(idEntidad) {
    idEntidadSeleccionada = idEntidad;
    var ent = todasMisEntidades.find(function(e) { return e.idEntidad === idEntidad; });
    aplicarFiltros();
    if (ent) pintarDetalle(ent);
  };

  // Genera 3 selects (Día/Mes en español/Año) para un campo de
  // fecha — reemplaza los <input type="date"> nativos, que muestran
  // mm/dd/aaaa según el navegador, sin importar la configuración.
  function htmlSelectorFecha(prefijoId) {
    var hoy = new Date();
    var mesActual = hoy.getMonth() + 1;
    var anioActual = hoy.getFullYear();
    var html = '<div style="display:flex; gap:6px;">';
    html += '<select id="' + prefijoId + '-dia" style="flex:1;"><option value="">Día</option>';
    for (var d = 1; d <= 31; d++) html += '<option value="' + d + '">' + d + '</option>';
    html += '</select>';
    html += '<select id="' + prefijoId + '-mes" style="flex:1.4;">';
    MESES_ES.forEach(function(nombreMes, i) {
      html += '<option value="' + (i + 1) + '"' + ((i + 1) === mesActual ? ' selected' : '') + '>' + nombreMes + '</option>';
    });
    html += '</select>';
    html += '<select id="' + prefijoId + '-anio" style="flex:1;">';
    for (var a = anioActual; a <= anioActual + 1; a++) html += '<option value="' + a + '"' + (a === anioActual ? ' selected' : '') + '>' + a + '</option>';
    html += '</select>';
    html += '</div>';
    return html;
  }

  // Genera un select de horas en pasos de 15 minutos (00:00 a
  // 23:45) — reemplaza el <input type="time"> nativo, que deja
  // elegir minuto por minuto (más precisión de la que se necesita).
  function htmlSelectorHora(idCampo) {
    var html = '<select id="' + idCampo + '"><option value="">Hora</option>';
    for (var h = 7; h <= 19; h++) {
      var valor = ('0' + h).slice(-2) + ':00';
      html += '<option value="' + valor + '">' + valor + '</option>';
    }
    html += '</select>';
    return html;
  }

  // Lee los 3 selects de vuelta a "YYYY-MM-DD" (o '' si falta algo).
  function leerFechaDeSelectores(prefijoId) {
    var dia = document.getElementById(prefijoId + '-dia').value;
    var mes = document.getElementById(prefijoId + '-mes').value;
    var anio = document.getElementById(prefijoId + '-anio').value;
    if (!dia || !mes || !anio) return '';
    return anio + '-' + ('0' + mes).slice(-2) + '-' + ('0' + dia).slice(-2);
  }

  window.zrgGuardarEdicion = function(idEntidad) {
    var elEstado = document.getElementById('zrg-estado-ed-' + idEntidad);
    var elBtn = document.getElementById('zrg-btn-guardar-ed-' + idEntidad);
    var nombre = document.getElementById('zrg-ed-nombre-' + idEntidad).value.trim();
    if (!nombre) { elEstado.textContent = 'El nombre no puede quedar vacío.'; return; }
    elEstado.textContent = '';
    elBtn.disabled = true;
    elBtn.textContent = 'Guardando...';

    var elCampoConf = document.getElementById('zrg-ed-empleadosconf-' + idEntidad);

    fetch(BASE_URL, {
      method: 'POST', mode: 'cors', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({
        accion: 'editarEntidad', ref: REF, idEntidad: idEntidad, nombre: nombre,
        telefono: document.getElementById('zrg-ed-tel-' + idEntidad).value.trim(),
        correo: document.getElementById('zrg-ed-correo-' + idEntidad).value.trim(),
        web: document.getElementById('zrg-ed-web-' + idEntidad).value.trim(),
        tipo: document.getElementById('zrg-ed-tipo-' + idEntidad).value,
        planteles: zrgLeerPlanteles('zrg-ed-planteles-' + idEntidad),
        empleadosElegibles: document.getElementById('zrg-ed-empleados-' + idEntidad).value.trim(),
        sectorEconomico: document.getElementById('zrg-ed-sector-' + idEntidad).value,
        publicoPrivado: document.getElementById('zrg-ed-pubpriv-' + idEntidad).value,
        religion: document.getElementById('zrg-ed-religion-' + idEntidad).value,
        empleadosConfirmados: elCampoConf ? elCampoConf.value.trim() : ''
      })
    })
      .then(function(res) { return res.json(); })
      .then(function(data) {
        if (data.exito) {
          elBtn.textContent = '✓ Guardado';
          elBtn.classList.add('zrg-btn-guardado');
          todasMisEntidades = null;
          setTimeout(function() { cargarYFiltrar(); }, 700);
        } else {
          elBtn.disabled = false;
          elBtn.textContent = 'Guardar cambios';
          elEstado.textContent = data.error || 'No se pudo guardar.';
        }
      })
      .catch(function() {
        elBtn.disabled = false;
        elBtn.textContent = 'Guardar cambios';
        elEstado.textContent = 'No se pudo conectar. Intenta de nuevo.';
      });
  };

  window.zrgGuardarEstado = function(idEntidad) {
    var estado = document.getElementById('zrg-estado-sel-' + idEntidad).value;
    var razonEl = document.getElementById('zrg-estado-razon-' + idEntidad);
    var razon = razonEl ? razonEl.value.trim() : '';
    var elMsg = document.getElementById('zrg-estado-estado-' + idEntidad);
    elMsg.textContent = '';
    if ((estado === 'Pendiente' || estado === 'No Interesado') && !razon) {
      elMsg.textContent = 'Escribe la razón antes de guardar.';
      return;
    }
    if (!(estado === 'Pendiente' || estado === 'No Interesado')) razon = '';
    var ent = entidadLocal(idEntidad);
    if (ent) {
      (ent.grupos || []).forEach(function(g) { if (g.etapaFunnel !== 'Programa Cerrado' || ES_ADMIN) { g.etapaFunnel = estado; g.razonEstado = razon; } });
      notaLocal(ent, 'ESTADO → ' + estado + (razon ? ' — ' + razon : ''));
      aplicarFiltros();
    }
    guardarEnSegundoPlano({ accion: 'actualizarEstadoEntidad', ref: REF, idEntidad: idEntidad, estado: estado, razon: razon }, 'No se pudo guardar el status. Se restauró.');
  };
  window.zrgGuardarSeguimiento = function(idEntidad) {
    var dia = document.getElementById('zrg-ed-seg-dia-' + idEntidad).value;
    var mes = document.getElementById('zrg-ed-seg-mes-' + idEntidad).value;
    var anio = document.getElementById('zrg-ed-seg-anio-' + idEntidad).value;
    var elEstado = document.getElementById('zrg-estado-seg-' + idEntidad);
    elEstado.textContent = '';

    var fecha = '';
    if (dia && mes && anio) {
      fecha = anio + '-' + ('0' + mes).slice(-2) + '-' + ('0' + dia).slice(-2);
    } else if (dia || mes || anio) {
      elEstado.textContent = 'Completa Día, Mes y Año, o deja los tres vacíos para quitar la fecha.';
      return;
    }

    fetch(BASE_URL, {
      method: 'POST', mode: 'cors', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ accion: 'actualizarProximoSeguimiento', ref: REF, idEntidad: idEntidad, proximoSeguimiento: fecha })
    })
      .then(function(res) { return res.json(); })
      .then(function(data) {
        if (data.exito) {
          todasMisEntidades = null;
          cargarYFiltrar();
        } else {
          elEstado.textContent = data.error || 'No se pudo guardar.';
        }
      })
      .catch(function() {
        elEstado.textContent = 'No se pudo conectar. Intenta de nuevo.';
      });
  };

  window.zrgAgregarGrupo = function(idEntidad) {
    var elEstado = document.getElementById('zrg-estado-grupo-' + idEntidad);
    elEstado.textContent = 'Creando...';
    fetch(BASE_URL, {
      method: 'POST', mode: 'cors', headers: { 'Content-Type': 'text/plain;charset=utf-8' },

    })
      .then(function(res) { return res.json(); })
      .then(function(data) {
        if (data.exito) {
          todasMisEntidades = null;
          cargarYFiltrar();
        } else {
          elEstado.textContent = data.error || 'No se pudo crear el Grupo.';
        }
      })
      .catch(function() { elEstado.textContent = 'No se pudo conectar. Intenta de nuevo.'; });

  window.zrgVerSugerencias = function(idEntidad) {
    var elBloque = document.getElementById('zrg-sugerencias-' + idEntidad);
    var abriendo = elBloque.classList.contains('zrg-oculto');
    elBloque.classList.toggle('zrg-oculto');
    if (!abriendo) return;

    elBloque.innerHTML = '<div class="zrg-linea">Cargando...</div>';
    fetch(BASE_URL + '?accion=resumenSugerenciasHorario&entidad=' + encodeURIComponent(idEntidad))
      .then(function(res) { return res.json(); })
      .then(function(data) {
        if (!data.exito || data.totalPersonas === 0) {
          elBloque.innerHTML = '<div class="zrg-linea">Ninguna sugerencia pendiente todavía.</div>';
          return;
        }
        var html = '<div class="zrg-linea"><b>' + data.totalPersonas + ' persona(s)</b> esperando horario.</div>';
        if (data.top3.length === 0) {
          html += '<div class="zrg-linea" style="color:#666;">Todavía nadie completó día Y hora juntos.</div>';
        } else {
          html += '<div class="zrg-linea" style="margin-top:6px;"><b>Top combinaciones más repetidas:</b></div>';
          data.top3.forEach(function(c, i) {
            html += '<div class="zrg-linea">' + (i + 1) + '. <b>' + c.dia + ' a las ' + c.hora + '</b> — ' + c.cantidad + ' persona(s) le sirve' + '</div>';
          });
        }
        html += '<div class="zrg-linea" style="color:#666; margin-top:4px;">Crea el Horario ganador arriba con "+ Agendar próxima sesión", y luego haz clic en "Asigna y Envía Horario a Participantes" — el botón naranja que aparece junto a ese Horario en la lista de "Grupos y Horarios".</div>';
        elBloque.innerHTML = html;
      })
      .catch(function() { elBloque.innerHTML = '<div class="zrg-linea">No se pudo cargar.</div>'; });
  };

  window.zrgConvertirSugerencias = function(idEntidad, idHorario) {
    if (!confirm('¿Asignar este Horario (' + idHorario + ') a todos los participantes que estaban esperando, y mandarles la invitación por correo?')) return;
    fetch(BASE_URL, {
      method: 'POST', mode: 'cors', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ accion: 'convertirSugerenciasAHorario', ref: REF, idEntidad: idEntidad, idHorario: idHorario })
    })
      .then(function(res) { return res.json(); })
      .then(function(data) {
        if (data.exito) {
          alert(data.convertidos + ' persona(s) convertidas y avisadas por correo.');
          todasMisEntidades = null;
          cargarYFiltrar();
        } else {
          alert(data.error || 'No se pudo convertir.');
        }
      })
      .catch(function() { alert('No se pudo conectar.'); });
  };

  window.zrgReenviarInvitacion = function(idEntidad, idHorario) {
    if (!confirm('¿Reenviar el correo de invitación de este Horario (' + idHorario + ') a TODOS los que ya están inscritos en él, aunque ya se les haya mandado antes?')) return;
    fetch(BASE_URL, {
      method: 'POST', mode: 'cors', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ accion: 'reenviarInvitacionHorario', ref: REF, idEntidad: idEntidad, idHorario: idHorario })
    })
      .then(function(res) { return res.json(); })
      .then(function(data) {
        if (data.exito) {
          alert(data.reenviados + ' persona(s) reavisadas por correo.');

      })
      .catch(function() { alert('No se pudo conectar.'); });

  window.zrgMostrarQrAsistencia = function(idHorario) {
    var elBloque = document.getElementById('zrg-qr-' + idHorario);
    var abriendo = elBloque.classList.contains('zrg-oculto');
    elBloque.classList.toggle('zrg-oculto');
    if (!abriendo) return;

    var url = 'https://maxx.mx/?horario=' + encodeURIComponent(idHorario) + '#confirmar-asistencia';
    var urlQr = 'https://api.qrserver.com/v1/create-qr-code/?size=260x260&data=' + encodeURIComponent(url);
    elBloque.innerHTML =
      '<div style="font-size:12px; color:#042C53; font-weight:bold; margin-bottom:6px;">Muestra este QR o comparte el link EN EL MOMENTO de esta sesión — está ligado a esta Entidad, Módulo y horario exactos:</div>' +
      '<img src="' + urlQr + '" alt="QR de asistencia" style="display:block; margin:0 auto 10px;">' +
      '<input type="text" readonly value="' + url + '" style="width:100%; box-sizing:border-box; padding:8px; border:2px solid #E6F1FB; border-radius:8px; font-size:12px; text-align:center;" onclick="this.select();">';
  };

  window.zrgMostrarFormAgendar = function(idEntidad, codigoGrupo, moduloDefault) {
    var elForm = document.getElementById('zrg-form-agendar-' + codigoGrupo);
    var abriendo = elForm.classList.contains('zrg-oculto');
    elForm.classList.toggle('zrg-oculto');
    if (!abriendo) return; // se está cerrando (Cancelar) — no hace falta llenar nada

    var elSelect = document.getElementById('zrg-hor-modulo-' + codigoGrupo);
    obtenerModulos(function(modulos) {
      elSelect.innerHTML = modulos.map(function(m) {
        return '<option value="' + m.numero + '"' + (m.numero === moduloDefault ? ' selected' : '') + '>' + m.numero + '. ' + m.titulo + '</option>';
      }).join('');
    });
  };

  window.zrgGuardarHorario = function(idEntidad, codigoGrupo) {
    var elEstado = document.getElementById('zrg-estado-hor-' + codigoGrupo);
    var numeroModulo = document.getElementById('zrg-hor-modulo-' + codigoGrupo).value;
    var fecha = leerFechaDeSelectores('zrg-hor-fecha-' + codigoGrupo);
    var hora = document.getElementById('zrg-hor-hora-' + codigoGrupo).value;
    var cupoMaximo = document.getElementById('zrg-hor-cupo-' + codigoGrupo).value;
    var fechaLimiteFinal = leerFechaDeSelectores('zrg-hor-limite-' + codigoGrupo);

    if (!fecha || !hora) { elEstado.textContent = 'Fecha y hora son obligatorias.'; return; }
    elEstado.textContent = 'Guardando...';

    fetch(BASE_URL, {
      method: 'POST', mode: 'cors', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({
        accion: 'crearHorario', ref: REF, codigoGrupo: codigoGrupo, numeroModulo: numeroModulo,
        fecha: fecha, hora: hora, cupoMaximo: cupoMaximo, fechaLimiteFinal: fechaLimiteFinal
      })
    })
      .then(function(res) { return res.json(); })
      .then(function(data) {
        if (data.exito) {
          todasMisEntidades = null;
          cargarYFiltrar();
        } else {
          elEstado.textContent = data.error || 'No se pudo guardar.';
        }
      })
      .catch(function() { elEstado.textContent = 'No se pudo conectar. Intenta de nuevo.'; });
  };

  // ===== Cambios "instantáneos": se pintan al momento y se guardan en segundo plano =====
  function entidadLocal(id) { return (todasMisEntidades || []).filter(function(e) { return e.idEntidad === id; })[0]; }
  function notaLocal(ent, texto) {
    var d = new Date(); function p(n) { return ('0' + n).slice(-2); }
    var linea = '[' + p(d.getDate()) + '/' + p(d.getMonth() + 1) + '/' + d.getFullYear() + ' ' + p(d.getHours()) + ':' + p(d.getMinutes()) + '] ' + texto;
    ent.notas = ent.notas ? (linea + '\n' + ent.notas) : linea;
  }
  function guardarEnSegundoPlano(cuerpo, mensajeFallo) {
    fetch(BASE_URL, { method: 'POST', mode: 'cors', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(cuerpo) })
      .then(function(res) { return res.json(); })
      .then(function(data) { if (!data.exito) recuperarPorFallo((data && data.error) || mensajeFallo); })
      .catch(function() { recuperarPorFallo('No se pudo conectar. ' + mensajeFallo); });
  }
  function recuperarPorFallo(texto) {
    alert(texto);
    todasMisEntidades = null;
    cargarYFiltrar();
  }

  window.zrgQuitarContacto = function(idContacto) {
    var btn = document.getElementById('zrg-quitar-' + idContacto);
    if (btn.getAttribute('data-seguro') !== '1') {
      btn.setAttribute('data-seguro', '1');
      btn.textContent = '¿Seguro?';
      setTimeout(function() { if (btn && btn.getAttribute('data-seguro') === '1') { btn.removeAttribute('data-seguro'); btn.textContent = 'Quitar'; } }, 4000);
      return;
    }
    var ent = entidadLocal(idEntidadSeleccionada);
    if (ent) {
      ent.contactos = (ent.contactos || []).filter(function(c) { return c.idContacto !== idContacto; });
      aplicarFiltros();
    }
    guardarEnSegundoPlano({ accion: 'eliminarContacto', ref: REF, idContacto: idContacto }, 'No se pudo quitar el contacto. Se restauró.');
  };
  window.zrgCambiarDecisor = function(idContacto) {
    var sel = document.getElementById('zrg-decisor-' + idContacto);
    if (!sel.value) return;
    var valor = sel.value;
    var ent = entidadLocal(idEntidadSeleccionada);
    if (ent) {
      (ent.contactos || []).forEach(function(c) { if (c.idContacto === idContacto) c.decisor = valor; });
      if (etapaDe(ent) === 'Registrado') {
        (ent.grupos || []).forEach(function(g) { if (g.etapaFunnel === 'Registrado') g.etapaFunnel = 'Contactado'; });
        notaLocal(ent, 'ESTADO → Contactado (ya hay contacto registrado)');
      }
      aplicarFiltros();
    }
    guardarEnSegundoPlano({ accion: 'actualizarDecisorContacto', ref: REF, idContacto: idContacto, decisor: valor }, 'No se pudo guardar. Se restauró.');
  };
  window.zrgMostrarFormContacto = function(idEntidad) {
    document.getElementById('zrg-form-contacto-' + idEntidad).classList.toggle('zrg-oculto');
  };

  window.zrgGuardarContacto = function(idEntidad) {
    var nombre = document.getElementById('zrg-con-nombre-' + idEntidad).value.trim();
    var elEstado = document.getElementById('zrg-estado-con-' + idEntidad);
    var elBtn = document.getElementById('zrg-btn-guardar-con-' + idEntidad);
    if (!nombre) { elEstado.textContent = 'Escribe el nombre del contacto.'; return; }
    var telefonoNuevo = document.getElementById('zrg-con-telefono-' + idEntidad).value.trim();
    var correoNuevo = document.getElementById('zrg-con-correo-' + idEntidad).value.trim();
    if (telefonoNuevo) {
      var mt = telefonoNuevo.match(/^(.*?)(?:\s*(?:ext\.?|extensi[oó]n|x)\s*(\d{1,6}))?$/i);
      var baseTel = (mt ? mt[1] : telefonoNuevo).replace(/[\s\-().]/g, '');
      var telOk = /^\+?52\d{10}$/.test(baseTel) || /^\d{10}$/.test(baseTel) || (/^\d{2,6}$/.test(baseTel) && !(mt && mt[2]));
      if (!telOk) { elEstado.textContent = 'El teléfono debe tener 10 dígitos (o solo la extensión, de 2 a 6 dígitos).'; return; }
    }
    if (correoNuevo && !/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(correoNuevo)) {
      elEstado.textContent = 'El correo no parece válido (ejemplo: nombre@empresa.com).';
      return;
    }
    var decisorNuevo = document.getElementById('zrg-con-decisor-' + idEntidad).value;
    if (!decisorNuevo) { elEstado.textContent = 'Elige si esta persona decide o ve la capacitación (o "Aún no lo sé").'; return; }
    elEstado.textContent = '';
    elBtn.disabled = true;
    elBtn.textContent = 'Guardando...';

    fetch(BASE_URL, {
      method: 'POST', mode: 'cors', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({
        accion: 'darDeAltaContacto', ref: REF, idEntidad: idEntidad, nombre: nombre,
        puesto: document.getElementById('zrg-con-puesto-' + idEntidad).value.trim(),
        telefono: document.getElementById('zrg-con-telefono-' + idEntidad).value.trim(),
        correo: document.getElementById('zrg-con-correo-' + idEntidad).value.trim(),
        decisor: decisorNuevo,
        notas: ''
      })
    })
      .then(function(res) { return res.json(); })
      .then(function(data) {
        if (data.exito) {
          elBtn.textContent = '✓ Guardado';
          elBtn.classList.add('zrg-btn-guardado');
          todasMisEntidades = null;
          setTimeout(function() { cargarYFiltrar(); }, 700);
        } else {
          elBtn.disabled = false;
          elBtn.textContent = 'Guardar contacto';
          elEstado.textContent = data.error || 'No se pudo guardar.';
        }
      })
      .catch(function() {
        elBtn.disabled = false;
        elBtn.textContent = 'Guardar contacto';
        elEstado.textContent = 'No se pudo conectar. Intenta de nuevo.';
      });
  };

  // La Galería avisa (vía localStorage, mismo origen) cuando da de alta una Escuela del lote como Entidad:
  // aquí se vuelve a leer la lista sola, sin refrescar la página.
  window.addEventListener('storage', function(ev) {
    if (ev.key === 'maxx_entidades_cambio') { todasMisEntidades = null; cargarYFiltrar(); }
  });

  cargarYFiltrar();
})();
</script>
