<style>
#zrg-wrap { max-width: 760px; margin: 0 auto; font-family: Arial, sans-serif; padding: 14px 16px 8px; }
#zrg-wrap h2 { color: #042C53; font-size: 16px; margin: 16px 0 8px 0; border-top: 1px solid #E6F1FB; padding-top: 14px; }
#zrg-wrap input, #zrg-wrap select, #zrg-wrap textarea {
  width: 100%; box-sizing: border-box; padding: 8px 10px; margin-bottom: 8px;
  border: 2px solid #E6F1FB; border-radius: 8px; font-size: 15px; font-family: Arial, sans-serif;
}
#zrg-wrap textarea { min-height: 50px; resize: vertical; }
#zrg-wrap label { display: block; font-size: 12px; color: #042C53; font-weight: bold; margin-bottom: 3px; }
.zrg-btn { background: #185FA5; color: white; border: none; border-radius: 8px; padding: 11px 18px; font-size: 14px; font-weight: bold; cursor: pointer; }
.zrg-btn:hover { background: #378ADD; }
.zrg-btn:disabled { background: #ccc; cursor: default; }
.zrg-btn-secundario { background: white; color: #185FA5; border: 2px solid #185FA5; }
.zrg-btn-secundario:hover { background: #E6F1FB; }
.zrg-btn-chico { padding: 6px 12px; font-size: 12px; }
.zrg-btn-guardado { background: #639922 !important; }
.zrg-btn-destacado { background: #EF9F27 !important; color: white !important; border: none !important; }
.zrg-btn-destacado:hover { background: #D98A15 !important; }
#zrg-resultados-busqueda { margin-top: -4px; }
.zrg-resultado-item { background: #FAECE7; border: 1px solid #F0997B; border-radius: 8px; padding: 10px 12px; margin-bottom: 8px; font-size: 13px; color: #712B13; }
.zrg-resultado-item strong { display: block; font-size: 14px; margin-bottom: 2px; }
.zrg-sin-resultados { color: #639922; font-size: 13px; font-weight: bold; padding: 8px 0; }
.zrg-card { background: #fff; border: 1px solid #E6F1FB; border-radius: 10px; padding: 12px 14px; margin-bottom: 10px; }
.zrg-card h3 { color: #042C53; font-size: 15px; margin: 0 0 4px 0; }
.zrg-card .zrg-tag { display: inline-block; background: #E6F1FB; color: #0C447C; font-size: 11px; font-weight: bold; border-radius: 12px; padding: 2px 9px; margin-right: 5px; margin-bottom: 6px; }
.zrg-card .zrg-tag-etapa { background: #EAF3DE; color: #27500A; }
.zrg-card .zrg-linea { font-size: 13px; color: #444; margin: 2px 0; }
.zrg-card .zrg-linea b { color: #042C53; }
.zrg-tooltip { display: inline-block; width: 16px; height: 16px; line-height: 16px; text-align: center; border-radius: 50%; background: #185FA5; color: #fff; font-size: 11px; font-weight: bold; cursor: help; margin-left: 5px; }
.zrg-plantel-fila { border: 1px solid #E6F1FB; border-radius: 8px; padding: 8px; margin-bottom: 8px; background: #FAFCFE; }
.zrg-plantel-fila input, .zrg-plantel-fila select { margin-bottom: 6px; }
.zrg-plantel-fila-sup { display: flex; gap: 6px; align-items: flex-start; }
.zrg-plantel-fila-sup .zrg-plantel-nombre { flex: 1; }
.zrg-plantel-fila-inf { display: flex; gap: 6px; }
.zrg-plantel-fila-inf .zrg-plantel-federativa { flex: 1.6; }
.zrg-plantel-fila-inf .zrg-plantel-cp { flex: 1; margin-bottom: 0; }
.zrg-plantel-fila-sup .zrg-btn-quitar-plantel { flex: 0 0 auto; background: #FAECE7; color: #C0392B; border: 1px solid #F0997B; border-radius: 8px; padding: 8px 10px; font-size: 12px; font-weight: bold; cursor: pointer; }
.zrg-planteles-lista { margin: 2px 0 6px; padding-left: 18px; font-size: 13px; color: #444; }
.zrg-planteles-lista li { margin-bottom: 3px; }
.zrg-contacto { border-top: 1px dashed #E6F1FB; padding-top: 6px; margin-top: 8px; font-size: 13px; }
.zrg-contacto-fila { display: flex; justify-content: space-between; align-items: center; padding: 3px 0; }
#zrg-estado { font-size: 13px; margin: 8px 0; min-height: 18px; }
.zrg-estado-ok { color: #27500A; font-weight: bold; }
.zrg-estado-error { color: #791F1F; font-weight: bold; }
.zrg-oculto { display: none; }
#zrg-cargando { text-align: center; color: #185FA5; padding: 20px; }

/* Filtros */
.zrg-filtros { display: flex; flex-direction: column; align-items: center; gap: 6px; max-width: 340px; margin: 0 auto 4px; }
.zrg-filtro-item { width: 100%; text-align: center; }
.zrg-filtro-chip-btn {
  display: inline-flex; align-items: center; gap: 6px; background: #E6F1FB; color: #0C447C;
  border: none; border-radius: 16px; padding: 7px 14px; font-size: 13px; font-weight: bold;
  cursor: pointer; font-family: Arial, sans-serif; margin: 0 auto;
}
.zrg-filtro-chip-btn.zrg-filtro-activo { background: #185FA5; color: white; }
.zrg-filtro-campo { margin-top: 6px; }
.zrg-filtro-campo input, .zrg-filtro-campo select { margin-bottom: 4px; }
.zrg-filtro-check { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: #042C53; font-weight: bold; cursor: pointer; }

/* Franja horizontal tipo "Camino al Éxito" */
.zrg-franja-wrap { position: relative; margin: 6px 0 6px; }
.zrg-franja { display: flex; gap: 12px; overflow-x: auto; padding: 4px 4px 8px; scroll-behavior: smooth; }
.zrg-franja.zrg-franja-centrada { justify-content: center; }
.zrg-chip-entidad { flex: 0 0 auto; width: 116px; text-align: center; cursor: pointer; background: none; border: none; font-family: Arial, sans-serif; }
.zrg-chip-circulo { width: 100px; height: 100px; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto; border: 3px solid transparent; position: relative; padding: 8px; box-sizing: border-box; }
.zrg-chip-entidad.zrg-chip-activo .zrg-chip-circulo { border-color: #185FA5; }
.zrg-chip-circulo-texto { font-size: 13px; font-weight: bold; color: #042C53; line-height: 1.2; display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
.zrg-chip-punto { width: 11px; height: 11px; border-radius: 50%; position: absolute; bottom: 4px; right: 8px; border: 2px solid white; }
.zrg-conteo-filtro { font-size: 12px; color: #666; margin: 0 0 4px; text-align: center; }
</style>

<script>
(function() {
  var hashActual = '';
  try {
    hashActual = window.top.location.hash || '';
  } catch (e) {
    hashActual = window.location.hash || '';
  }
  if (hashActual.indexOf('#zona-referidor-galeria') !== 0) {
    return;
  }

  var REF, TS_LOGIN;
  try {
    var parametrosUrl = new URLSearchParams(window.top.location.search);
    REF = parametrosUrl.get('ref') || '';
    TS_LOGIN = parametrosUrl.get('t') || '';
  } catch (e) {
    var parametrosUrlLocal = new URLSearchParams(window.location.search);
    REF = parametrosUrlLocal.get('ref') || '';
    TS_LOGIN = parametrosUrlLocal.get('t') || '';
  }

  var SESION_MAXIMA_MS = 30 * 60 * 1000;
  var sesionExpirada = !TS_LOGIN || (Date.now() - parseInt(TS_LOGIN, 10)) > SESION_MAXIMA_MS;
  if (!REF || sesionExpirada) {
    window.top.location.href = 'https://maxx.mx/#zona-referidor';
    return;
  }

  var BASE_URL = 'https://script.google.com/macros/s/AKfycbxNl4ATBbC5fKm6SvIFwnApzEYt_qCkSSEcL-RXqoDucXSDcQjj_oOzWSL0oaGT5Qnn/exec';
  var CODIGOS_ADMIN = ['LGen_9997', 'LGen_9998', 'LGen_9999']; // mismos 3 códigos que en el backend — solo para mostrar/ocultar campos
  var ES_ADMIN = (CODIGOS_ADMIN.indexOf(REF) !== -1);
  var TAMANO_PROMEDIO_GRUPO = 15;

  var ENTIDADES_FEDERATIVAS = ['Aguascalientes', 'Baja California', 'Baja California Sur', 'Campeche', 'Chiapas',
    'Chihuahua', 'Ciudad de México', 'Coahuila', 'Colima', 'Durango', 'Guanajuato', 'Guerrero', 'Hidalgo',
    'Jalisco', 'México', 'Michoacán', 'Morelos', 'Nayarit', 'Nuevo León', 'Oaxaca', 'Puebla', 'Querétaro',
    'Quintana Roo', 'San Luis Potosí', 'Sinaloa', 'Sonora', 'Tabasco', 'Tamaulipas', 'Tlaxcala', 'Veracruz',
    'Yucatán', 'Zacatecas'];

  var SECTORES_ECONOMICOS = ['Agricultura, Ganadería y Pesca', 'Manufactura/Industrial', 'Construcción',
    'Comercio (Retail/Mayoreo)', 'Tecnología/TI', 'Servicios Financieros', 'Salud', 'Educación',
    'Alimentos y Bebidas', 'Transporte y Logística', 'Turismo y Hospitalidad', 'Energía', 'Telecomunicaciones',
    'Bienes Raíces', 'Gobierno/Sector Público', 'Servicios Profesionales', 'Medios y Entretenimiento',
    'Automotriz', 'Textil y Moda', 'Otro'];

  var RELIGIONES = ['Católica', 'Cristiana Evangélica', 'Judía', 'Musulmana', 'Budista', 'Testigos de Jehová', 'Mormona', 'Otra'];

  var MESES_ES = ['Enero', 'Febrero', 'Marzo', 'Abril', 'Mayo', 'Junio', 'Julio', 'Agosto', 'Septiembre', 'Octubre', 'Noviembre', 'Diciembre'];

  var COLOR_TIPO = {
    'Escuela': '#DCEAFB', 'Empresa': '#FCEAD6', 'Personal': '#E3F2D9', 'Religioso': '#EDE3F5', 'Otro': '#EEEEEE'
  };
  var TIPOS_GRUPO_AFIN = ['Personal', 'Religioso', 'Grupo de Facebook', 'Grupo de Instagram', 'Grupo de WhatsApp', 'Grupo en Otra Red Social', 'Otro'];
  function esTipoGrupoAfin(tipo) { return TIPOS_GRUPO_AFIN.indexOf(tipo) !== -1; }
  // Distinto de TIPOS_GRUPO_AFIN (que rige sugerencias/horarios): esto
  // rige qué Tipos son "institucionales" — tienen una ubicación física
  // propia (Escuela/Empresa/Religioso/Otro) y por lo tanto tiene
  // sentido pedirles Planteles/Ubicaciones Y Entidad Federativa (dónde
  // vive ESA institución). Personal y los 4 tipos de Redes Sociales NO
  // son institucionales — son un grupo de personas sin domicilio
  // propio; ahí es cada PARTICIPANTE quien captura su propio Código
  // Postal y Entidad Federativa al registrarse, no la Entidad.
  var TIPOS_INSTITUCIONALES = ['Escuela', 'Empresa', 'Religioso', 'Otro'];
  function tipoEsInstitucional(tipo) { return TIPOS_INSTITUCIONALES.indexOf(tipo) !== -1; }
  var COLOR_ETAPA = {
    'Registrado': '#9AA0A6', 'Contactado': '#378ADD', 'Cita Agendada': '#EF9F27',
    'Programa Cerrado': '#639922', 'Pendiente': '#E0B400', 'No Interesado': '#C0392B'
  };

  function llenarSelectFederativa(el) {
    el.innerHTML = '<option value="">' + (el.id === 'zrg-f-federativa' ? 'Todas' : 'Selecciona...') + '</option>' +
      ENTIDADES_FEDERATIVAS.map(function(e) { return '<option value="' + e + '">' + e + '</option>'; }).join('');
  }

  // Convierte el texto de "Notas" (con entradas "[fecha hora] texto"
  // acumuladas) en HTML, resaltando cada marca de fecha/hora en azul
  // — para que se vea de un vistazo cuándo se hizo cada seguimiento.
  function formatearNotasConColor(texto) {
    if (!texto) return '<span style="color:#999;">Ningún seguimiento todavía.</span>';
    var escapado = String(texto).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    return escapado
      .replace(/\[(\d{2}\/\d{2}\/\d{4} \d{2}:\d{2})\]/g, '<span style="color:#185FA5; font-weight:bold;">[$1]</span>')
      .replace(/\n/g, '<br>');
  }
  llenarSelectFederativa(document.getElementById('zrg-f-federativa'));

  function llenarSelectGenerico(el, lista, textoTodas) {
    el.innerHTML = '<option value="">' + textoTodas + '</option>' +
      lista.map(function(e) { return '<option value="' + e + '">' + e + '</option>'; }).join('');
  }
  llenarSelectGenerico(document.getElementById('zrg-alta-sector'), SECTORES_ECONOMICOS, 'Selecciona...');
  llenarSelectGenerico(document.getElementById('zrg-alta-religion'), RELIGIONES, 'Selecciona...');
  llenarSelectGenerico(document.getElementById('zrg-f-sector'), SECTORES_ECONOMICOS, 'Todos');

  // Mostrar solo el campo que corresponde al Tipo elegido (Sector
  // Económico para Empresa, Público/Privado para Escuela, Religión
  // para Religioso) — tanto en "Dar de alta" como luego en "Editar".
  function actualizarCamposPorTipo(tipo, sufijoSector, sufijoPubPriv, sufijoReligion, sufijoPlanteles, idListaPlanteles) {
    var elSector = document.getElementById(sufijoSector);
    var elPubPriv = document.getElementById(sufijoPubPriv);
    var elReligion = document.getElementById(sufijoReligion);
    if (elSector) elSector.classList.toggle('zrg-oculto', tipo !== 'Empresa');
    if (elPubPriv) elPubPriv.classList.toggle('zrg-oculto', tipo !== 'Escuela');
    if (elReligion) elReligion.classList.toggle('zrg-oculto', tipo !== 'Religioso');
    // Planteles/Ubicaciones (con su Entidad Federativa y Código Postal
    // PROPIOS de cada plantel): solo aplican a Tipos institucionales
    // (Escuela/Empresa/Religioso/Otro). Personal y los 4 tipos de
    // Redes Sociales NO tienen domicilio propio como Entidad; ahí es
    // cada participante quien captura su propio Código Postal y
    // Entidad Federativa al registrarse.
    var esInstitucional = tipoEsInstitucional(tipo);
    if (sufijoPlanteles) {
      var elPlanteles = document.getElementById(sufijoPlanteles);
      if (elPlanteles) elPlanteles.classList.toggle('zrg-oculto', !esInstitucional);
      if (!esInstitucional && idListaPlanteles) zrgLimpiarPlanteles(idListaPlanteles);
    }
  }

  document.getElementById('zrg-alta-tipo').addEventListener('change', function() {
    actualizarCamposPorTipo(this.value, 'zrg-alta-sector-wrap', 'zrg-alta-pubpriv-wrap', 'zrg-alta-religion-wrap', 'zrg-alta-planteles-wrap', 'zrg-alta-planteles-lista');
  });
  actualizarCamposPorTipo(document.getElementById('zrg-alta-tipo').value, 'zrg-alta-sector-wrap', 'zrg-alta-pubpriv-wrap', 'zrg-alta-religion-wrap', 'zrg-alta-planteles-wrap', 'zrg-alta-planteles-lista');

  // Chips de filtro: cada uno abre/cierra su propio campo.
  Array.prototype.forEach.call(document.querySelectorAll('.zrg-filtro-chip-btn'), function(btn) {
    btn.addEventListener('click', function() {
      document.getElementById(btn.dataset.campo).classList.toggle('zrg-oculto');
    });
  });

  var elBuscar = document.getElementById('zrg-buscar');
  var elResultadosBusqueda = document.getElementById('zrg-resultados-busqueda');
  var elBtnMostrarAlta = document.getElementById('zrg-btn-mostrar-alta');
  var elFormAlta = document.getElementById('zrg-form-alta');
  var elBtnGuardarAlta = document.getElementById('zrg-btn-guardar-alta');
  var elBtnCancelarAlta = document.getElementById('zrg-btn-cancelar-alta');
  var elEstadoAlta = document.getElementById('zrg-estado-alta');
  var elCargando = document.getElementById('zrg-cargando');
  var elConteoFiltro = document.getElementById('zrg-conteo-filtro');
  var elFranja = document.getElementById('zrg-franja');
  var elDetalle = document.getElementById('zrg-detalle');

  var todasMisEntidades = null;
  var MODULOS_CACHE = null;

  function obtenerModulos(callback) {
    if (MODULOS_CACHE) { callback(MODULOS_CACHE); return; }
    fetch(BASE_URL + '?accion=modulos')
      .then(function(res) { return res.json(); })
      .then(function(data) {
        MODULOS_CACHE = (data.exito && data.modulos) ? data.modulos : [];
        callback(MODULOS_CACHE);
      })
      .catch(function() { callback([]); });
  }
  var idEntidadSeleccionada = null;

    var texto = elBuscar.value.trim();
    clearTimeout(temporizadorBusqueda);
    if (texto.length < 2) { elResultadosBusqueda.innerHTML = ''; return; }
    temporizadorBusqueda = setTimeout(function() { buscarEntidad(texto); }, 350);
  });

  function buscarEntidad(texto) {
    fetch(BASE_URL + '?accion=buscarEntidad&q=' + encodeURIComponent(texto))
      .then(function(res) { return res.json(); })
      .then(function(data) {
        if (!data.exito) { elResultadosBusqueda.innerHTML = ''; return; }
        if (data.coincidencias.length === 0) {
          elResultadosBusqueda.innerHTML = '<div class="zrg-sin-resultados">No hay ninguna coincidencia — puedes darla de alta con confianza.</div>';
          return;
        }
        var html = '';
        data.coincidencias.forEach(function(c) {
          var quienLaTiene = (c.codigoReferidor === REF) ? 'TU código' : 'el código ' + c.codigoReferidor;
          html += '<div class="zrg-resultado-item"><strong>' + c.nombre + '</strong>' + c.tipo + (c.ubicacion ? ' — ' + c.ubicacion : '') + '<br>Ya registrada con ' + quienLaTiene + '. Coordínate antes de dar de alta una nueva.</div>';
        });
        elResultadosBusqueda.innerHTML = html;
      })
      .catch(function() { elResultadosBusqueda.innerHTML = ''; });
  }

  // --- Helpers de "Planteles / Ubicaciones" (lista dinámica, se
  // usan tanto en "Dar de alta" como en "Editar"). Cada Plantel es
  // su propia tarjeta con Nombre, Dirección, Entidad Federativa y
  // Código Postal — a propósito NO hay un solo valor de Entidad
  // Federativa para toda la Entidad, porque cada plantel puede estar
  // en un estado distinto.
  window.zrgAgregarFilaPlantel = function(contenedorId, datosPlantel) {
    datosPlantel = datosPlantel || {};
    var contenedor = document.getElementById(contenedorId);
    if (!contenedor) return;
    var fila = document.createElement('div');
    fila.className = 'zrg-plantel-fila';

    var filaSup = document.createElement('div');
    filaSup.className = 'zrg-plantel-fila-sup';
    var elNombre = document.createElement('input');
    elNombre.type = 'text';
    elNombre.placeholder = 'Nombre del plantel (ej. "Campus Norte")';
    elNombre.className = 'zrg-plantel-nombre';
    elNombre.value = datosPlantel.nombre || '';
    var elQuitar = document.createElement('button');
    elQuitar.type = 'button';
    elQuitar.className = 'zrg-btn-quitar-plantel';
    elQuitar.textContent = 'Quitar';
    elQuitar.addEventListener('click', function() {
      fila.remove();
      contenedor.dispatchEvent(new Event('input'));
    });
    filaSup.appendChild(elNombre);
    filaSup.appendChild(elQuitar);

    var elDireccion = document.createElement('input');
    elDireccion.type = 'text';
    elDireccion.placeholder = 'Dirección (calle, número, colonia)';
    elDireccion.className = 'zrg-plantel-direccion';
    elDireccion.value = datosPlantel.direccion || '';

    var filaInf = document.createElement('div');
    filaInf.className = 'zrg-plantel-fila-inf';
    var elFederativa = document.createElement('select');
    elFederativa.className = 'zrg-plantel-federativa';
    llenarSelectFederativa(elFederativa);
    elFederativa.value = datosPlantel.entidadFederativa || '';
    var elCP = document.createElement('input');
    elCP.type = 'text';
    elCP.placeholder = 'C.P.';
    elCP.className = 'zrg-plantel-cp';
    elCP.value = datosPlantel.codigoPostal || '';
    filaInf.appendChild(elFederativa);
    filaInf.appendChild(elCP);

    fila.appendChild(filaSup);
    fila.appendChild(elDireccion);
    fila.appendChild(filaInf);
    contenedor.appendChild(fila);
  };

  function zrgLeerPlanteles(contenedorId) {
    var contenedor = document.getElementById(contenedorId);
    if (!contenedor) return [];
    var planteles = [];
    contenedor.querySelectorAll('.zrg-plantel-fila').forEach(function(fila) {
      var nombre = fila.querySelector('.zrg-plantel-nombre').value.trim();
      var direccion = fila.querySelector('.zrg-plantel-direccion').value.trim();
      var entidadFederativa = fila.querySelector('.zrg-plantel-federativa').value;
      var codigoPostal = fila.querySelector('.zrg-plantel-cp').value.trim();
      if (nombre || direccion || entidadFederativa || codigoPostal) {
        planteles.push({ nombre: nombre, direccion: direccion, entidadFederativa: entidadFederativa, codigoPostal: codigoPostal });
      }
    });
    return planteles;
  }

  function zrgLimpiarPlanteles(contenedorId) {
    var contenedor = document.getElementById(contenedorId);
    if (contenedor) contenedor.innerHTML = '';
  }

  document.getElementById('zrg-alta-btn-agregar-plantel').addEventListener('click', function() {
    window.zrgAgregarFilaPlantel('zrg-alta-planteles-lista');
  });

  elBtnMostrarAlta.addEventListener('click', function() {
    elFormAlta.classList.remove('zrg-oculto');
    elBtnMostrarAlta.classList.add('zrg-oculto');
  });
  elBtnCancelarAlta.addEventListener('click', function() {
    elFormAlta.classList.add('zrg-oculto');
    elBtnMostrarAlta.classList.remove('zrg-oculto');
    elEstadoAlta.textContent = '';
    zrgLimpiarPlanteles('zrg-alta-planteles-lista');
  });

  elBtnGuardarAlta.addEventListener('click', function() {
    var nombre = document.getElementById('zrg-alta-nombre').value.trim();
    if (!nombre) { elEstadoAlta.textContent = 'Escribe el nombre de la Entidad.'; return; }

    elBtnGuardarAlta.disabled = true;
    elBtnGuardarAlta.textContent = 'Guardando...';
    elEstadoAlta.textContent = '';

    fetch(BASE_URL, {
      method: 'POST', mode: 'cors', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({
        accion: 'darDeAltaEntidad', ref: REF, nombre: nombre,
        tipo: document.getElementById('zrg-alta-tipo').value,
        planteles: zrgLeerPlanteles('zrg-alta-planteles-lista'),
        empleadosElegibles: document.getElementById('zrg-alta-empleados').value.trim(),
        sectorEconomico: document.getElementById('zrg-alta-sector').value,
        publicoPrivado: document.getElementById('zrg-alta-pubpriv').value,
        religion: document.getElementById('zrg-alta-religion').value,
        notas: document.getElementById('zrg-alta-notas').value.trim()
      })
    })
      .then(function(res) { return res.json(); })
      .then(function(data) {
        elBtnGuardarAlta.disabled = false;
        elBtnGuardarAlta.textContent = 'Guardar Entidad';
        if (data.exito) {
          ['zrg-alta-nombre', 'zrg-alta-empleados', 'zrg-alta-notas'].forEach(function(id) {
            document.getElementById(id).value = '';
          });
          zrgLimpiarPlanteles('zrg-alta-planteles-lista');
          document.getElementById('zrg-alta-sector').value = '';
          document.getElementById('zrg-alta-pubpriv').value = '';
          document.getElementById('zrg-alta-religion').value = '';
          document.getElementById('zrg-alta-tipo').value = 'Escuela';
          actualizarCamposPorTipo('Escuela', 'zrg-alta-sector-wrap', 'zrg-alta-pubpriv-wrap', 'zrg-alta-religion-wrap', 'zrg-alta-planteles-wrap', 'zrg-alta-planteles-lista');
          elFormAlta.classList.add('zrg-oculto');
          elBtnMostrarAlta.classList.remove('zrg-oculto');
          todasMisEntidades = null;
          cargarYFiltrar();
        } else {
          elEstadoAlta.textContent = data.error || 'No se pudo guardar. Intenta de nuevo.';
        }
      })
      .catch(function() {
        elBtnGuardarAlta.disabled = false;
        elBtnGuardarAlta.textContent = 'Guardar Entidad';
        elEstadoAlta.textContent = 'No se pudo conectar. Intenta de nuevo.';
      });
  });

  function cargarYFiltrar() {
    if (todasMisEntidades !== null) { aplicarFiltros(); return; }
    elCargando.style.display = 'block';
    elCargando.textContent = 'Cargando TUS Entidades...';
    fetch(BASE_URL + '?accion=misEntidades&ref=' + encodeURIComponent(REF))
      .then(function(res) { return res.json(); })
      .then(function(data) {
        elCargando.style.display = 'none';
        if (!data.exito) {
          elFranja.innerHTML = '<p style="color:#791F1F;">No se pudieron cargar TUS Entidades.</p>';
          return;
        }
        todasMisEntidades = data.entidades;
        var elTitulo = document.getElementById('zrg-titulo-entidades');
        var n = todasMisEntidades.length;
        elTitulo.textContent = n === 0
          ? 'Todavía no tienes Entidades dadas de alta'
          : (n === 1 ? 'Tienes 1 Entidad dada de alta, ¿deseas filtrarla?' : 'Tienes ' + n + ' Entidades dadas de alta, ¿deseas filtrarlas?');
        aplicarFiltros();
      })
      .catch(function() {
        elCargando.textContent = 'No se pudo conectar. Recarga la página.';
      });
  }

  function etapaDe(ent) {
    return (ent.grupos && ent.grupos[0] && ent.grupos[0].etapaFunnel) || 'Registrado';
  }

  function actualizarChipsActivos() {
    var mapa = {
      'zrg-f-tipo-campo': document.getElementById('zrg-f-tipo').value,
      'zrg-f-etapa-campo': document.getElementById('zrg-f-etapa').value,
      'zrg-f-nombre-entidad-campo': document.getElementById('zrg-f-nombre-entidad').value.trim(),
      'zrg-f-nombre-contacto-campo': document.getElementById('zrg-f-nombre-contacto').value.trim(),
      'zrg-f-federativa-campo': document.getElementById('zrg-f-federativa').value,
      'zrg-f-sector-campo': document.getElementById('zrg-f-sector').value
    };
    Array.prototype.forEach.call(document.querySelectorAll('.zrg-filtro-chip-btn'), function(btn) {
      btn.classList.toggle('zrg-filtro-activo', !!mapa[btn.dataset.campo]);
    });
  }

  function aplicarFiltros() {
    actualizarChipsActivos();
    var tipo = document.getElementById('zrg-f-tipo').value;
    var etapa = document.getElementById('zrg-f-etapa').value;
    var nombreEnt = document.getElementById('zrg-f-nombre-entidad').value.trim().toLowerCase();
    var nombreCon = document.getElementById('zrg-f-nombre-contacto').value.trim().toLowerCase();
    var federativa = document.getElementById('zrg-f-federativa').value;
    var sector = document.getElementById('zrg-f-sector').value;
    var solo30dias = document.getElementById('zrg-f-30dias').checked;
    var soloSeguimientoHoy = document.getElementById('zrg-f-seguimiento-hoy').checked;
    var hace30dias = Date.now() - (30 * 24 * 60 * 60 * 1000);
    var finDeHoy = new Date(); finDeHoy.setHours(23,59,59,999);

    var filtradas = (todasMisEntidades || []).filter(function(ent) {
      if (tipo && ent.tipo !== tipo) return false;
      if (etapa && etapaDe(ent) !== etapa) return false;
      if (nombreEnt && ent.nombre.toLowerCase().indexOf(nombreEnt) === -1) return false;
      if (federativa) {
        // La Entidad Federativa ya no vive en la Entidad — vive en
        // cada Plantel (una misma Entidad puede tener planteles en
        // varios estados). El filtro busca si CUALQUIERA de sus
        // planteles está en el estado elegido.
        var coincideFederativa = (ent.planteles || []).some(function(p) { return p.entidadFederativa === federativa; });
        if (!coincideFederativa) return false;
      }
      if (sector && ent.sectorEconomico !== sector) return false;
      if (solo30dias && (!ent.fechaAlta || ent.fechaAlta < hace30dias)) return false;
      if (soloSeguimientoHoy && (!ent.proximoSeguimiento || ent.proximoSeguimiento > finDeHoy.getTime())) return false;
      if (nombreCon) {
        var algunContactoCoincide = (ent.contactos || []).some(function(c) {
          return (c.nombre || '').toLowerCase().indexOf(nombreCon) !== -1;
        });
        if (!algunContactoCoincide) return false;
      }
      return true;
    });

    pintarFranja(filtradas);
  }

  ['zrg-f-tipo', 'zrg-f-etapa', 'zrg-f-federativa', 'zrg-f-sector'].forEach(function(id) {
    document.getElementById(id).addEventListener('change', cargarYFiltrar);
  });
  document.getElementById('zrg-f-30dias').addEventListener('change', cargarYFiltrar);
  document.getElementById('zrg-f-seguimiento-hoy').addEventListener('change', cargarYFiltrar);
  var temporizadorFiltroTexto = null;
  ['zrg-f-nombre-entidad', 'zrg-f-nombre-contacto'].forEach(function(id) {
    document.getElementById(id).addEventListener('input', function() {
      clearTimeout(temporizadorFiltroTexto);
      temporizadorFiltroTexto = setTimeout(cargarYFiltrar, 300);
    });

  function pintarFranja(entidades) {
    elConteoFiltro.classList.remove('zrg-oculto');
    elConteoFiltro.textContent = entidades.length === 0
      ? 'Ninguna Entidad coincide con esos filtros.'
      : (entidades.length === 1 ? '1 Entidad' : entidades.length + ' Entidades');

    if (entidades.length === 0) {
      elFranja.innerHTML = '';
      elDetalle.innerHTML = '';
      idEntidadSeleccionada = null;
      return;
    }

    var html = '';
    entidades.forEach(function(ent) {
      var activo = (ent.idEntidad === idEntidadSeleccionada) ? ' zrg-chip-activo' : '';
      var colorEtapa = COLOR_ETAPA[etapaDe(ent)] || '#9AA0A6';
      var colorTipo = COLOR_TIPO[ent.tipo] || COLOR_TIPO['Otro'];
      html += '<button class="zrg-chip-entidad' + activo + '" onclick="window.zrgSeleccionarEntidad(\'' + ent.idEntidad + '\')">' +
        '<div class="zrg-chip-circulo" style="background:' + colorTipo + ';">' +
        '<span class="zrg-chip-circulo-texto">' + ent.nombre + '</span>' +
        '<span class="zrg-chip-punto" style="background:' + colorEtapa + ';"></span></div></button>';
    });
    elFranja.classList.toggle('zrg-franja-centrada', entidades.length < 7);
    elFranja.innerHTML = html;

    if (idEntidadSeleccionada) {
      var entSeleccionada = entidades.filter(function(e) { return e.idEntidad === idEntidadSeleccionada; })[0];
      if (entSeleccionada) {
        pintarDetalle(entSeleccionada); // sigue abierta — se repinta con los datos frescos
      } else {
        idEntidadSeleccionada = null;
        elDetalle.innerHTML = '';
      }
    }
  }

  window.zrgSeleccionarEntidad = function(idEntidad) {
    idEntidadSeleccionada = idEntidad;
    var ent = todasMisEntidades.find(function(e) { return e.idEntidad === idEntidad; });
    aplicarFiltros();
    if (ent) pintarDetalle(ent);
  };

  // Genera 3 selects (Día/Mes en español/Año) para un campo de
  // fecha — reemplaza los <input type="date"> nativos, que muestran
  // mm/dd/aaaa según el navegador, sin importar la configuración.
  function htmlSelectorFecha(prefijoId) {
    var hoy = new Date();
    var mesActual = hoy.getMonth() + 1;
    var anioActual = hoy.getFullYear();
    var html = '<div style="display:flex; gap:6px;">';
    html += '<select id="' + prefijoId + '-dia" style="flex:1;"><option value="">Día</option>';
    for (var d = 1; d <= 31; d++) html += '<option value="' + d + '">' + d + '</option>';
    html += '</select>';
    html += '<select id="' + prefijoId + '-mes" style="flex:1.4;">';
    MESES_ES.forEach(function(nombreMes, i) {
      html += '<option value="' + (i + 1) + '"' + ((i + 1) === mesActual ? ' selected' : '') + '>' + nombreMes + '</option>';
    });
    html += '</select>';
    html += '<select id="' + prefijoId + '-anio" style="flex:1;">';
    for (var a = anioActual; a <= anioActual + 1; a++) html += '<option value="' + a + '"' + (a === anioActual ? ' selected' : '') + '>' + a + '</option>';
    html += '</select>';
    html += '</div>';
    return html;
  }

  // Genera un select de horas en pasos de 15 minutos (00:00 a
  // 23:45) — reemplaza el <input type="time"> nativo, que deja
  // elegir minuto por minuto (más precisión de la que se necesita).
  function htmlSelectorHora(idCampo) {
    var html = '<select id="' + idCampo + '"><option value="">Hora</option>';
    for (var h = 7; h <= 19; h++) {
      var valor = ('0' + h).slice(-2) + ':00';
      html += '<option value="' + valor + '">' + valor + '</option>';
    }
    html += '</select>';
    return html;
  }

  // Lee los 3 selects de vuelta a "YYYY-MM-DD" (o '' si falta algo).
  function leerFechaDeSelectores(prefijoId) {
    var dia = document.getElementById(prefijoId + '-dia').value;
    var mes = document.getElementById(prefijoId + '-mes').value;
    var anio = document.getElementById(prefijoId + '-anio').value;
    if (!dia || !mes || !anio) return '';
    return anio + '-' + ('0' + mes).slice(-2) + '-' + ('0' + dia).slice(-2);
  }

  window.zrgGuardarEdicion = function(idEntidad) {
    var elEstado = document.getElementById('zrg-estado-ed-' + idEntidad);
    var elBtn = document.getElementById('zrg-btn-guardar-ed-' + idEntidad);
    var nombre = document.getElementById('zrg-ed-nombre-' + idEntidad).value.trim();
    if (!nombre) { elEstado.textContent = 'El nombre no puede quedar vacío.'; return; }
    elEstado.textContent = '';
    elBtn.disabled = true;
    elBtn.textContent = 'Guardando...';

    var elCampoConf = document.getElementById('zrg-ed-empleadosconf-' + idEntidad);
    var elCampoMod = document.getElementById('zrg-ed-modulos-' + idEntidad);

    fetch(BASE_URL, {
      method: 'POST', mode: 'cors', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({
        accion: 'editarEntidad', ref: REF, idEntidad: idEntidad, nombre: nombre,
        tipo: document.getElementById('zrg-ed-tipo-' + idEntidad).value,
        planteles: zrgLeerPlanteles('zrg-ed-planteles-' + idEntidad),
        empleadosElegibles: document.getElementById('zrg-ed-empleados-' + idEntidad).value.trim(),
        sectorEconomico: document.getElementById('zrg-ed-sector-' + idEntidad).value,
        publicoPrivado: document.getElementById('zrg-ed-pubpriv-' + idEntidad).value,
        religion: document.getElementById('zrg-ed-religion-' + idEntidad).value,
        empleadosConfirmados: elCampoConf ? elCampoConf.value.trim() : '',
        modulosComprometidos: elCampoMod ? elCampoMod.value.trim() : ''
      })
    })
      .then(function(res) { return res.json(); })
      .then(function(data) {
        if (data.exito) {
          elBtn.textContent = '✓ Guardado';
          elBtn.classList.add('zrg-btn-guardado');
          todasMisEntidades = null;
          setTimeout(function() { cargarYFiltrar(); }, 700);
        } else {
          elBtn.disabled = false;
          elBtn.textContent = 'Guardar cambios';
          elEstado.textContent = data.error || 'No se pudo guardar.';
        }
      })
      .catch(function() {
        elBtn.disabled = false;
        elBtn.textContent = 'Guardar cambios';
        elEstado.textContent = 'No se pudo conectar. Intenta de nuevo.';
      });
  };

  window.zrgGuardarSeguimiento = function(idEntidad) {
    var dia = document.getElementById('zrg-ed-seg-dia-' + idEntidad).value;
    var mes = document.getElementById('zrg-ed-seg-mes-' + idEntidad).value;
    var anio = document.getElementById('zrg-ed-seg-anio-' + idEntidad).value;
    var elEstado = document.getElementById('zrg-estado-seg-' + idEntidad);
    elEstado.textContent = '';

    var fecha = '';
    if (dia && mes && anio) {
      fecha = anio + '-' + ('0' + mes).slice(-2) + '-' + ('0' + dia).slice(-2);
    } else if (dia || mes || anio) {
      elEstado.textContent = 'Completa Día, Mes y Año, o deja los tres vacíos para quitar la fecha.';
      return;
    }

    fetch(BASE_URL, {
      method: 'POST', mode: 'cors', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ accion: 'actualizarProximoSeguimiento', ref: REF, idEntidad: idEntidad, proximoSeguimiento: fecha })
    })
      .then(function(res) { return res.json(); })
      .then(function(data) {
        if (data.exito) {
          todasMisEntidades = null;
          cargarYFiltrar();
        } else {
          elEstado.textContent = data.error || 'No se pudo guardar.';
        }
      })
      .catch(function() {
        elEstado.textContent = 'No se pudo conectar. Intenta de nuevo.';
      });
  };

  window.zrgVerSugerencias = function(idEntidad) {
    var elBloque = document.getElementById('zrg-sugerencias-' + idEntidad);
    var abriendo = elBloque.classList.contains('zrg-oculto');
    elBloque.classList.toggle('zrg-oculto');
    if (!abriendo) return;

    elBloque.innerHTML = '<div class="zrg-linea">Cargando...</div>';
    fetch(BASE_URL + '?accion=resumenSugerenciasHorario&entidad=' + encodeURIComponent(idEntidad))
      .then(function(res) { return res.json(); })
      .then(function(data) {
        if (!data.exito || data.totalPersonas === 0) {
          elBloque.innerHTML = '<div class="zrg-linea">Ninguna sugerencia pendiente todavía.</div>';
          return;
        }
        var html = '<div class="zrg-linea"><b>' + data.totalPersonas + ' persona(s)</b> esperando horario.</div>';
        if (data.top3.length === 0) {
          html += '<div class="zrg-linea" style="color:#666;">Todavía nadie completó día Y hora juntos.</div>';
        } else {
          html += '<div class="zrg-linea" style="margin-top:6px;"><b>Top combinaciones más repetidas:</b></div>';
          data.top3.forEach(function(c, i) {
            html += '<div class="zrg-linea">' + (i + 1) + '. <b>' + c.dia + ' a las ' + c.hora + '</b> — ' + c.cantidad + ' persona(s) le sirve' + '</div>';
          });
        }
        html += '<div class="zrg-linea" style="color:#666; margin-top:4px;">Crea el Horario ganador arriba con "+ Agendar próxima sesión", y luego haz clic en "Asigna y Envía Horario a Participantes" — el botón naranja que aparece junto a ese Horario en la lista de "Grupos y Horarios".</div>';
        elBloque.innerHTML = html;

      .catch(function() { elBloque.innerHTML = '<div class="zrg-linea">No se pudo cargar.</div>'; });

    if (!abriendo) return; // se está cerrando (Cancelar) — no hace falta llenar nada

    var elSelect = document.getElementById('zrg-hor-modulo-' + codigoGrupo);
    obtenerModulos(function(modulos) {
      elSelect.innerHTML = modulos.map(function(m) {
        return '<option value="' + m.numero + '"' + (m.numero === moduloDefault ? ' selected' : '') + '>' + m.numero + '. ' + m.titulo + '</option>';
      }).join('');
    });
  };

  window.zrgGuardarHorario = function(idEntidad, codigoGrupo) {
    var elEstado = document.getElementById('zrg-estado-hor-' + codigoGrupo);
    var numeroModulo = document.getElementById('zrg-hor-modulo-' + codigoGrupo).value;
    var fecha = leerFechaDeSelectores('zrg-hor-fecha-' + codigoGrupo);
    var hora = document.getElementById('zrg-hor-hora-' + codigoGrupo).value;
    var cupoMaximo = document.getElementById('zrg-hor-cupo-' + codigoGrupo).value;
    var fechaLimiteFinal = leerFechaDeSelectores('zrg-hor-limite-' + codigoGrupo);

    if (!fecha || !hora) { elEstado.textContent = 'Fecha y hora son obligatorias.'; return; }
    elEstado.textContent = 'Guardando...';

    fetch(BASE_URL, {
      method: 'POST', mode: 'cors', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({
        accion: 'crearHorario', ref: REF, codigoGrupo: codigoGrupo, numeroModulo: numeroModulo,
        fecha: fecha, hora: hora, cupoMaximo: cupoMaximo, fechaLimiteFinal: fechaLimiteFinal
      })
    })
      .then(function(res) { return res.json(); })
      .then(function(data) {
        if (data.exito) {
          todasMisEntidades = null;
          cargarYFiltrar();
        } else {
          elEstado.textContent = data.error || 'No se pudo guardar.';
        }
      })
      .catch(function() { elEstado.textContent = 'No se pudo conectar. Intenta de nuevo.'; });
  };

  window.zrgMostrarFormContacto = function(idEntidad) {
    document.getElementById('zrg-form-contacto-' + idEntidad).classList.toggle('zrg-oculto');
  };

  window.zrgGuardarContacto = function(idEntidad) {
    var nombre = document.getElementById('zrg-con-nombre-' + idEntidad).value.trim();
    var elEstado = document.getElementById('zrg-estado-con-' + idEntidad);
    var elBtn = document.getElementById('zrg-btn-guardar-con-' + idEntidad);
    if (!nombre) { elEstado.textContent = 'Escribe el nombre del contacto.'; return; }
    elEstado.textContent = '';
    elBtn.disabled = true;
    elBtn.textContent = 'Guardando...';

    fetch(BASE_URL, {
      method: 'POST', mode: 'cors', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({
        accion: 'darDeAltaContacto', ref: REF, idEntidad: idEntidad, nombre: nombre,
        puesto: document.getElementById('zrg-con-puesto-' + idEntidad).value.trim(),
        telefono: document.getElementById('zrg-con-telefono-' + idEntidad).value.trim(),
        correo: document.getElementById('zrg-con-correo-' + idEntidad).value.trim(),
        notas: ''
      })
    })
      .then(function(res) { return res.json(); })
      .then(function(data) {
        if (data.exito) {
          elBtn.textContent = '✓ Guardado';
          elBtn.classList.add('zrg-btn-guardado');
          todasMisEntidades = null;
          setTimeout(function() { cargarYFiltrar(); }, 700);
        } else {
          elBtn.disabled = false;
          elBtn.textContent = 'Guardar contacto';
          elEstado.textContent = data.error || 'No se pudo guardar.';
        }
      })
      .catch(function() {
        elBtn.disabled = false;
        elBtn.textContent = 'Guardar contacto';
        elEstado.textContent = 'No se pudo conectar. Intenta de nuevo.';
      });
  };

  cargarYFiltrar();
})();
</script>
